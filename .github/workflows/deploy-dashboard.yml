name: Deploy dashboard

# Push-to-deploy for the bound Apps Script dashboard, so shipping is one
# `git push` instead of a git push plus a manual clasp push + deploy.
#
# The safety gate is check_sidebar.js (see CLAUDE.md): Apps Script has no build
# step, so a typo'd server function or a stale CFG column constant would only
# surface in the live dashboard. A failing check means no push and no deploy.
on:
  push:
    branches: [main]
    paths:
      - 'sidebar/**'
      - 'check_sidebar.js'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target (production or stage)
        required: true
        default: production
      description:
        description: Deployment description (defaults to the commit subject)
        required: false

# Never run two deploys against one Apps Script project at once.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The gate. Runs before any credential is written to disk, so a broken
      # commit fails without ever touching Google.
      - name: Verify sidebar (offline)
        run: node check_sidebar.js sidebar

      # clasp 3.x stores auth as { tokens: { default: {...} } } — a different
      # shape from clasp 2.x. The version is pinned so the secret written below
      # is always in the format the installed clasp expects.
      - name: Install clasp
        run: npm install -g @google/clasp@3.0.6-alpha

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          STAGE_CLASPRC_JSON: ${{ secrets.STAGE_CLASPRC_JSON }}
        run: |
          set -euo pipefail
          TARGET_ENV="${{ github.event.inputs.environment || 'production' }}"
          case "${TARGET_ENV}" in production|stage) ;; *) echo "::error::environment must be production or stage"; exit 1 ;; esac
          if [ "${TARGET_ENV}" = stage ]; then
            CREDENTIALS="${STAGE_CLASPRC_JSON}"
          else
            CREDENTIALS="${CLASPRC_JSON}"
          fi
          if [ -z "${CREDENTIALS}" ]; then
            echo "::error::credentials for ${TARGET_ENV} are not configured"
            exit 1
          fi
          # Written via env, never echoed: this is a Google OAuth refresh token
          # and the repo is public, so it must never reach the build log.
          printf '%s' "${CREDENTIALS}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          node -e 'const t=require(process.env.HOME+"/.clasprc.json").tokens?.default;
                   if(!t||!t.refresh_token) throw new Error("clasprc.json has no tokens.default.refresh_token — is it clasp 3.x format?");
                   console.log("credentials OK (clasp 3.x shape)");'

      - name: Push and deploy
        working-directory: sidebar
        env:
          # Not a secret: the web app is access=MYSELF, so only the owning
          # Google account can open this URL. Pinned because the project has
          # several deployments and an unpinned `clasp deploy` would create a
          # NEW one, leaving the URL actually in use untouched.
          DEPLOYMENT_ID: AKfycbyvVvKPI45Y5zooV9VbzYSN_54EWqQTqjsE6bJPTgBpfvcdJZ13YIynh3rBKdRM3bKaag
          PRODUCTION_SCRIPT_ID: 1P4l2DY_XwHjRBSeja7MOkSFCrvZXufo2AzKrfd8ex9Srg3uHKg1VK5R7
          PRODUCTION_DEPLOYMENT_ID: AKfycbyvVvKPI45Y5zooV9VbzYSN_54EWqQTqjsE6bJPTgBpfvcdJZ13YIynh3rBKdRM3bKaag
          TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}
          STAGE_SCRIPT_ID: ${{ secrets.STAGE_SCRIPT_ID }}
          STAGE_DEPLOYMENT_ID: ${{ secrets.STAGE_DEPLOYMENT_ID }}
          INPUT_DESC: ${{ inputs.description }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${TARGET_ENV}" = stage ]; then
            if [ -z "${STAGE_SCRIPT_ID}" ] || [ -z "${STAGE_DEPLOYMENT_ID}" ]; then
              echo "::error::Stage script/deployment target is not configured"
              exit 1
            fi
            if [ "${STAGE_SCRIPT_ID}" = "${PRODUCTION_SCRIPT_ID}" ] || [ "${STAGE_DEPLOYMENT_ID}" = "${PRODUCTION_DEPLOYMENT_ID}" ]; then
              echo "::error::Stage target matches the pinned Production target"
              exit 1
            fi
            node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync(".clasp.json","utf8")); c.scriptId=process.env.STAGE_SCRIPT_ID; fs.writeFileSync(".clasp.json", JSON.stringify(c, null, 2)+"\n");'
            DEPLOYMENT_ID="${STAGE_DEPLOYMENT_ID}"
          fi
          if ! clasp list-deployments | grep -F -- "${DEPLOYMENT_ID}" >/dev/null; then
            echo "::error::deployment ${DEPLOYMENT_ID} is not registered in the selected Apps Script project"
            exit 1
          fi
          DESC="${INPUT_DESC:-}"
          if [ -z "${DESC}" ]; then DESC="$(printf '%s' "${COMMIT_SUBJECT}" | head -n 1)"; fi
          if [ -z "${DESC}" ]; then DESC="manual dispatch"; fi
          echo "deploying: ${DESC}"
          clasp push -f
          clasp deploy -i "${DEPLOYMENT_ID}" -d "${DESC}"
          echo "--- deployments after ---"
          clasp list-deployments | grep "${DEPLOYMENT_ID}"
