<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<title>交易 Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg-void: #121418; --bg-surface: #191c22; --bg-raised: #222630; --border: #2b303a;
    --text-primary: #e6e8ec; --text-muted: #969ba7; --accent: #8296c4;
    --spend: #c46a58; --income: #6a9c82; --warn: #b39a68; --net: #8a93a6;
    --up: #c46a58; --down: #6a9c82;
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
    --r-card:10px; --r-ctl:8px; --r-pill:14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg-void); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums slashed-zero; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 var(--sp4) var(--sp6); }
  .proto { max-width: 980px; margin: var(--sp3) auto 0; padding: var(--sp2) var(--sp3); color: var(--text-muted); font-size: 12px; }
  .proto b { color: var(--text-primary); font-weight: 600; }

  .head { position: sticky; top: 0; z-index: 5; background: var(--bg-void); border-bottom: 1px solid var(--border);
    margin: 0 calc(-1 * var(--sp4)) var(--sp4); padding: var(--sp4) var(--sp4) 0; }
  .head-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp3); margin-bottom: var(--sp3); }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .period { font-size: 14px; color: var(--text-muted); }
  .tabs { display: flex; gap: var(--sp5); }
  .tabs button { border: none; background: none; cursor: pointer; padding: 2px 0 10px; border-bottom: 2px solid transparent; text-align: left; }
  .tabs button .tt { display: block; font-size: 14px; font-weight: 600; color: var(--text-muted); }
  .tabs button .tsub { display: block; font-size: 11px; color: var(--text-muted); opacity: .85; margin-top: 1px; }
  .tabs button.active { border-bottom-color: var(--accent); }
  .tabs button.active .tt { color: var(--text-primary); }
  .controls { display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; margin: var(--sp3) 0 var(--sp4); }
  .clabel { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; margin-right: 2px; }
  .ctl { border: 1px solid transparent; background: var(--bg-raised); color: var(--text-muted); height: 28px; padding: 0 14px;
    border-radius: var(--r-pill); font-size: 12px; font-weight: 500; cursor: pointer; }
  .ctl.active { background: transparent; border-color: var(--accent); color: var(--text-primary); }
  .sel { display: flex; gap: var(--sp1); align-items: center; transition: opacity .12s; }
  .sel.dim { opacity: 1; }
  .sel select { background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--r-ctl);
    padding: 5px 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .sel.picked select { border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--text-muted); margin-left: auto; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-bottom: var(--sp3); background: var(--border);
    border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  .kpis.k3 { grid-template-columns: repeat(3, 1fr); margin-bottom: var(--sp4); }
  .kpi { background: var(--bg-surface); padding: var(--sp3) var(--sp4); }
  .kpi .k-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: var(--sp1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .k-value { font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--text-primary); }
  .kpi .k-value.pos { color: var(--income); } .kpi .k-value.neg { color: var(--spend); } .kpi .k-value.spend { color: var(--spend); } .kpi .k-value.income { color: var(--income); }
  .kpi .k-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .k-sub2 { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .delta { font-weight: 600; } .delta.up { color: var(--up); } .delta.down { color: var(--down); }
  .meter { height: 3px; border-radius: 2px; background: var(--bg-raised); margin-top: 6px; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 2px; }
  @media (max-width: 640px) { .kpis, .kpis.k3 { grid-template-columns: repeat(2, 1fr); } }

  .projstrip { display: flex; align-items: center; gap: var(--sp4); flex-wrap: wrap; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--r-card); padding: var(--sp3) var(--sp4); margin-bottom: var(--sp4); }
  .projstrip .pl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
  .projstrip .pv { font-size: 15px; font-weight: 600; }
  .projstrip .pn { font-size: 11px; color: var(--text-muted); margin-left: auto; }

  .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: var(--sp3); margin-bottom: var(--sp4); }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp4); }
  .panel h3 { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: var(--sp3); text-transform: uppercase; letter-spacing: .07em; display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp2); }
  .panel h3.inc { color: var(--income); }
  .h3note { text-transform: none; letter-spacing: 0; color: var(--text-muted); font-weight: 400; }
  .donut-wrap { display: flex; gap: var(--sp4); align-items: center; }
  .legend { flex: 1; min-width: 0; }
  .legend .lg { display: flex; align-items: center; gap: var(--sp2); font-size: 13px; margin-bottom: 7px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .legend .lg-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend .lg-amt { color: var(--text-primary); font-size: 12px; min-width: 64px; text-align: right; }
  .legend .lg-pct { color: var(--text-muted); font-size: 12px; min-width: 36px; text-align: right; }

  .lrow { display: flex; align-items: center; gap: var(--sp2); font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .lrow:last-child { border-bottom: none; }
  .lrow .ln { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .ls { color: var(--text-muted); font-size: 11px; }
  .lrow .la { font-weight: 600; color: var(--text-primary); } .lrow .la.inc { color: var(--income); }
  .sharebar { height: 3px; border-radius: 2px; background: var(--bg-raised); margin-top: 5px; overflow: hidden; }
  .sharebar > i { display: block; height: 100%; background: var(--income); opacity: .8; }
  .ltot { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--sp3); padding-top: var(--sp3); border-top: 1px solid var(--border); }
  .ltot .t-l { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
  .ltot .t-v { font-size: 20px; font-weight: 600; }

  .trend { position: relative; display: flex; align-items: flex-end; gap: var(--sp2); height: 132px; padding-top: 18px; border-bottom: 1px solid var(--border); }
  .tgrid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); pointer-events: none; }
  .tgrid span { position: absolute; right: 0; top: -8px; font-size: 11px; color: var(--text-muted); background: var(--bg-surface); padding-left: 4px; }
  .tcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; justify-content: flex-end; z-index: 1; }
  .tbars { display: flex; align-items: flex-end; gap: 3px; height: 108px; }
  .tbars > i { width: 9px; border-radius: 2px 2px 0 0; display: block; }
  .b-inc { background: var(--income); }
  .spendstack { display: flex; flex-direction: column; justify-content: flex-end; width: 9px; }
  .spendstack i { width: 9px; display: block; }
  .b-exp { background: var(--spend); }
  .b-proj { background: repeating-linear-gradient(-45deg, var(--spend) 0 3px, transparent 3px 6px); opacity: .5; border-radius: 2px 2px 0 0; }
  .tcol.partial .b-exp, .tcol.partial .b-inc { opacity: .55; }
  .tlabel { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .tnetv { font-size: 10px; font-weight: 600; white-space: nowrap; }
  .tlegend { display: flex; gap: var(--sp4); font-size: 11px; color: var(--text-muted); margin-top: var(--sp3); flex-wrap: wrap; }
  .tlegend span { display: inline-flex; align-items: center; gap: 5px; }
  .tlegend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .tlegend i.proj { background: repeating-linear-gradient(-45deg, var(--spend) 0 2px, transparent 2px 4px); }

  .moretog { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--r-card);
    padding: 9px; font-size: 12px; cursor: pointer; margin-bottom: var(--sp4); }
  .moretog:hover { background: var(--bg-raised); }

  .toolbar { display: flex; gap: var(--sp2); align-items: center; margin: var(--sp2) 0 var(--sp3); }
  .toolbar h2 { font-size: 14px; font-weight: 600; margin-right: auto; }
  .toolbar h2 .th { font-weight: 400; color: var(--text-muted); font-size: 12px; }
  .search { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--r-ctl);
    padding: 7px 12px; font-size: 13px; width: 200px; }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--text-muted); }

  .row-card, .pcard { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp3) var(--sp4);
    margin-bottom: var(--sp2); cursor: pointer; transition: background .12s; }
  .row-card:hover, .pcard:hover { background: var(--bg-raised); }
  .rc-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp3); }
  .rc-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: var(--sp2); min-width: 0; }
  .rc-name .dot, .pc-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .rc-end { display: flex; align-items: center; gap: var(--sp2); white-space: nowrap; }
  .chev { color: var(--text-muted); font-size: 11px; transition: transform .15s; }
  .row-card.open .chev, .pcard.open .chev { transform: rotate(90deg); }
  .rc-total, .pc-total { font-weight: 600; font-size: 15px; color: var(--text-primary); white-space: nowrap; }
  .rc-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .drill { margin-top: var(--sp3); border-top: 1px solid var(--border); padding-top: var(--sp2); display: none; }
  .row-card.open .drill, .pcard.open .pdrill { display: block; }
  .txn { display: flex; align-items: center; gap: var(--sp2); font-size: 12px; padding: 5px 0; }
  .txn .m { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn .a { color: var(--text-primary); font-weight: 600; } .txn .d { color: var(--text-muted); }
  .txn .cat { color: var(--text-muted); background: var(--bg-raised); border-radius: 4px; padding: 0 6px; font-size: 11px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 4px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); }

  .pc-top { display: flex; align-items: center; gap: var(--sp2); }
  .pc-name { font-size: 14px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: var(--sp2); }
  .pc-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: var(--sp3); flex-wrap: wrap; }
  .pc-spark { margin-top: var(--sp2); }
  .pc-spark .slab { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
  .pdrill { margin-top: var(--sp3); border-top: 1px solid var(--border); padding-top: var(--sp3); display: none; }
  .mbars { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin: var(--sp2) 0 var(--sp3); }
  .mbars .mb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; justify-content: flex-end; }
  .mbars .mb > i { width: 100%; max-width: 16px; border-radius: 2px 2px 0 0; opacity: .85; }
  .mbars .mb span { font-size: 11px; color: var(--text-muted); }

  /* per-card panel */
  .cardrow { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .cardrow:last-child { border-bottom: none; }
  .cardrow .ctop { display: flex; align-items: baseline; gap: var(--sp2); }
  .cardrow .cname { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: var(--sp2); min-width: 0; }
  .cardrow .cdot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .cardrow .camt { margin-left: auto; font-weight: 600; white-space: nowrap; }
  .cardrow .cpct { color: var(--text-muted); font-size: 12px; min-width: 38px; text-align: right; }
  .cardrow .cmeta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* category ranking + MoM */
  .rank { display: flex; align-items: center; gap: var(--sp3); padding: 9px 0; border-bottom: 1px solid var(--border); }
  .rank:last-child { border-bottom: none; }
  .rank .rk { font-size: 12px; color: var(--text-muted); width: 16px; }
  .rank .rdot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .rank .rn { flex: 1; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .rbar-wrap { flex: 1.4; }
  .rank .rbar { height: 6px; border-radius: 3px; background: var(--bg-raised); overflow: hidden; }
  .rank .rbar > i { display: block; height: 100%; }
  .rank .ra { font-weight: 600; min-width: 76px; text-align: right; }
  .rank .rd { min-width: 60px; text-align: right; font-size: 12px; }
  .delta.flat { color: var(--text-muted); }

  /* spend calendar heatmap */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .dow { font-size: 11px; color: var(--text-muted); text-align: center; padding-bottom: 2px; }
  .cell { aspect-ratio: 1; border-radius: 5px; background: var(--bg-raised); border: 1px solid transparent;
    display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px 4px; }
  .cell .dn { font-size: 10px; color: var(--text-muted); opacity: .7; }
  .cell.future { opacity: .28; }
  .cell.today { border-color: var(--net); }
  .cell.void { background: transparent; border: none; }
  .cell.hit { cursor: pointer; }
  .cell.hit:hover { outline: 1px solid var(--text-muted); outline-offset: -1px; }
  .cell.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .hdetail { margin-top: var(--sp3); border-top: 1px solid var(--border); padding-top: var(--sp3); }
  .hdet-h { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--sp2); }
  .hdet-h b { color: var(--text-primary); font-weight: 600; }
  .heatlegend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-top: var(--sp3); justify-content: flex-end; }
  .heatlegend .sw { width: 14px; height: 10px; border-radius: 2px; }
  .heat-tip { display: flex; gap: var(--sp4); flex-wrap: wrap; margin-top: var(--sp3); font-size: 12px; color: var(--text-muted); }
  .heat-tip b { color: var(--text-primary); }

  /* editable day list */
  .ev-head { display: flex; align-items: center; gap: var(--sp2); margin: var(--sp3) 0 var(--sp2); flex-wrap: wrap; }
  .ev-head .lbl { font-size: 12px; color: var(--text-muted); }
  .ev-toggle { margin-left: auto; font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--border); border-radius: var(--r-pill); padding: 3px 12px; cursor: pointer; }
  .ev-toggle:hover { background: var(--bg-raised); }
  .erow { padding: 9px 0; border-bottom: 1px solid var(--border); transition: opacity .15s; }
  .erow:last-child { border-bottom: none; }
  .erow.done { opacity: .5; }
  .er1 { display: flex; align-items: baseline; gap: var(--sp2); }
  .er1 .mer { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .er1 .merin { flex: 1; min-width: 0; font: inherit; font-weight: 600; color: inherit; background: none; border: 1px solid transparent; border-radius: 5px; padding: 2px 5px; margin: -2px 0 -2px -5px; }
  .er1 .merin:hover { border-color: var(--border); }
  .er1 .merin:focus { outline: none; border-color: var(--accent); background: var(--bg-raised); }
  .er1 .merin::placeholder { color: var(--text-muted); font-weight: 400; }
  .er1 .amt { font-weight: 600; white-space: nowrap; }
  .er2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .er2 .fld { display: flex; align-items: center; gap: 4px; }
  .er2 .fld .lb { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .er2 select { background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12px; cursor: pointer; }
  .er2 select:focus { outline: none; border-color: var(--accent); }
  .erec { margin-left: auto; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-muted); border-radius: 7px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .erec:hover { border-color: var(--income); color: var(--income); }
  .erow.done .erec { border-color: var(--income); color: var(--income); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 18px; border-radius: var(--r-pill); font-size: 13px; opacity: 0; transition: all .2s; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.4); z-index: 20; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--spend); color: var(--spend); }

  /* add-transaction button + modal */
  .addbtn { display: inline-flex; align-items: center; gap: 5px; background: var(--accent); color: #0e1220; border: none; border-radius: var(--r-ctl); padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .addbtn:hover { filter: brightness(1.08); }
  .txdel, .erdel { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; width: 26px; height: 24px; cursor: pointer; flex-shrink: 0; font-size: 12px; }
  .txdel:hover, .erdel:hover { border-color: var(--spend); color: var(--spend); }
  .overlay { position: fixed; inset: 0; background: rgba(8,10,14,.6); display: none; align-items: flex-start; justify-content: center; padding: 6vh var(--sp4); z-index: 30; }
  .overlay.on { display: flex; }
  .modal { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); width: 100%; max-width: 460px; padding: var(--sp4); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: var(--sp1); }
  .modal .msub { font-size: 12px; color: var(--text-muted); margin-bottom: var(--sp4); }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
  .mfld { display: flex; flex-direction: column; gap: 4px; } .mfld.full { grid-column: 1/-1; }
  .mfld label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .mfld label .req { color: var(--spend); }
  .modal input, .modal select { background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; font-size: 14px; font-family: inherit; }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
  .modal input.bad { border-color: var(--spend); }
  .minfo { grid-column: 1/-1; font-size: 12px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 8px 10px; }
  .minfo b { color: var(--text-primary); }
  .macts { display: flex; gap: var(--sp2); justify-content: flex-end; margin-top: var(--sp4); }
  .mbtn { border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-primary); border-radius: 7px; padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .mbtn.primary { background: var(--accent); border-color: var(--accent); color: #0e1220; }
  .mbtn:hover { filter: brightness(1.08); }

  .empty { text-align: center; padding: var(--sp6) var(--sp4); color: var(--text-muted); }
  .footer { text-align: center; padding: var(--sp4); font-size: 12px; color: var(--text-muted); }
  .loading, .error { text-align: center; padding: var(--sp6) var(--sp4); color: var(--text-muted); }
  .error { color: var(--spend); }
</style>
</head>
<body>
<div class="wrap"><div id="app"><div class="loading">載入中…</div></div></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3>新增交易</h3>
    <div class="msub">手動補記(現金等非 email 來源) · 儲存後標為已記帳</div>
    <div class="mgrid">
      <div class="mfld"><label>日期 <span class="req">*</span></label><input type="date" id="a-date"></div>
      <div class="mfld"><label>金額 <span class="req">*</span></label><input type="number" id="a-amt" placeholder="0" min="0" inputmode="numeric"></div>
      <div class="mfld"><label>收支別 <span class="req">*</span></label><select id="a-type"><option>支出</option><option>收入</option><option>轉帳</option></select></div>
      <div class="mfld"><label>來源</label><select id="a-source"><option>現金</option><option>悠遊卡</option><option>LINE Pay</option><option>街口支付</option><option>轉帳</option><option>其他</option></select></div>
      <div class="mfld full"><label>商店 / 說明</label><input type="text" id="a-mer" placeholder="例：路邊攤晚餐"></div>
      <div class="mfld"><label>類別</label><select id="a-cat"></select></div>
      <div class="mfld"><label>TAG（專案）</label><select id="a-tag"></select></div>
      <div class="minfo">儲存後 <b>已記帳 ✓</b> · 手動列可在明細裡刪除</div>
    </div>
    <div class="macts"><button class="mbtn" id="a-cancel">取消</button><button class="mbtn primary" id="a-save">新增</button></div>
  </div>
</div>
<script>
  // muted, cool-leaning, and deliberately AVOIDS red/green so category hues never read as spend/income
  var PALETTE = ['#5f9aa0','#6f88a8','#9a8bb0','#b39a68','#6d8f9e','#8497b8','#7b9ca6','#a99a6a'];
  var REST_COLOR = '#5a6070';
  var NOW = { year: +('<?= now.year ?>'), month: +('<?= now.month ?>'), day: +('<?= now.day ?>') };
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }

  var PROJ_COLOR = { '重機':'#5f9aa0','房子':'#6f88a8','汽車':'#9a8bb0','旅遊':'#b39a68','進修':'#6d8f9e' };

  var TXNS = [];

  var state = { tab:'category', scope:'month', selYear:NOW.year, selMonth:NOW.month, q:'', projScope:'all', more:false, showDone:false };
  var openRow=null, openProj=null, openHeatDay=null;

  function resolveScope(s){ if(/^\d{4}-\d{2}$/.test(s)){ var p=s.split('-'); return {level:'month',year:+p[0],month:+p[1]}; } if(/^\d{4}$/.test(s)) return {level:'year',year:+s}; if(s==='month') return {level:'month',year:NOW.year,month:NOW.month}; if(s==='year') return {level:'year',year:NOW.year}; return {level:'all'}; }
  function isCurMonth(r){ return r.level==='month'&&r.year===NOW.year&&r.month===NOW.month; }
  function isPartialCur(r){ return isCurMonth(r)&&NOW.day<daysInMonth(NOW.year,NOW.month); }
  function inScope(t,r){ if(r.level==='all') return true; if(r.level==='year') return t.y===r.year; return t.y===r.year&&t.m===r.month; }
  function periodLabel(r){ if(r.level==='all') return '全部期間'; if(r.level==='year') return r.year+' 全年'+(r.year===NOW.year?'(1–'+NOW.month+' 月)':''); return r.year+' 年 '+r.month+' 月'+(isPartialCur(r)?'(至今 '+NOW.day+' 日)':''); }
  function prevScope(r){ if(r.level==='month'){ var y=r.year,m=r.month-1; if(m<1){m=12;y--;} return {level:'month',year:y,month:m,upto:isPartialCur(r)?NOW.day:null}; } if(r.level==='year'){ return {level:'year',year:r.year-1,upto:(r.year===NOW.year?NOW.month:null)}; } return null; }
  function isIncome(t){ return t.type==='收入'&&t.cat!=='退款'; }
  function isRefund(t){ return t.type==='收入'&&t.cat==='退款'; }
  function inUpto(t,r,upto){ return !upto || (r.level==='year'? t.m<=upto : t.d<=upto); }
  function sumScope(pred,r,upto){ return TXNS.filter(function(t){ return pred(t)&&inScope(t,r)&&inUpto(t,r,upto); }).reduce(function(s,t){return s+t.amount;},0); }
  function sum(a){ return a.reduce(function(s,t){return s+t.amount;},0); }
  function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}); return s[Math.floor(s.length/2)]; }
  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function isPick(){ return /^\d{4}(-\d{2})?$/.test(state.scope); }
  function yearOptions(){ var ys={}; ys[NOW.year]=1; TXNS.forEach(function(t){ if(t.y) ys[t.y]=1; }); var arr=Object.keys(ys).map(Number).sort(function(a,b){return b-a;}); var o=''; arr.forEach(function(y){ o+='<option value="'+y+'"'+(y===state.selYear?' selected':'')+'>'+y+'</option>'; }); return o; }
  function monthOptions(){ var o='<option value="0"'+(state.selMonth===0?' selected':'')+'>全年</option>'; for(var m=1;m<=12;m++) o+='<option value="'+m+'"'+(m===state.selMonth?' selected':'')+'>'+m+' 月</option>'; return o; }
  function meterColor(rate){ return rate<10?'var(--spend)':(rate<20?'var(--warn)':'var(--income)'); }

  // month-end projection: exclude one-off lumps AND recurring subs from the daily base, add them once
  function projectMonth(expOfMonth, elapsed, dim, subNames, subTot){
    if(elapsed>=dim) return sum(expOfMonth);
    var lumpCut=Math.max(8000, 3*median(expOfMonth.map(function(t){return t.amount;})));
    var base=expOfMonth.filter(function(t){return t.amount<lumpCut && !subNames[t.merchant];});
    var lump=expOfMonth.filter(function(t){return t.amount>=lumpCut;});
    return Math.round(sum(base)/elapsed*dim + sum(lump) + subTot);
  }

  function donut(items,grand,caption){
    var R=52,C=2*Math.PI*R,cx=70,cy=70;
    var top=items.slice(0,6),rest=items.slice(6),segs=top.map(function(it,i){return {total:it.total,color:PALETTE[i]};});
    if(rest.length) segs.push({total:rest.reduce(function(s,x){return s+x.total;},0),color:REST_COLOR});
    var s='<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="分佈">';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--bg-raised)" stroke-width="20"/>';
    var acc=0;
    if(grand>0) segs.forEach(function(sg){ var dash=sg.total/grand*C;
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+sg.color+'" stroke-width="20" stroke-dasharray="'+Math.max(0,dash-3).toFixed(2)+' '+(C-Math.max(0,dash-3)).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>'; acc+=dash; });
    s+='<text x="'+cx+'" y="65" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+(caption||'合計')+'</text>';
    s+='<text x="'+cx+'" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-primary)">$'+fmt(grand)+'</text></svg>';
    return s;
  }
  function sparkline(vals,color){ var w=220,h=30,max=Math.max.apply(null,vals)||1,n=vals.length; if(n<2) return ''; var pts=vals.map(function(v,i){ return (i/(n-1)*w).toFixed(1)+','+(h-v/max*(h-3)-1).toFixed(1); }).join(' '); var lx=w,ly=h-vals[n-1]/max*(h-3)-1; return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.2" fill="'+color+'"/></svg>'; }
  function legend(items,grand){ if(!items.length) return '<div style="color:var(--text-muted);font-size:12px">無資料</div>'; var top=items.slice(0,6),rest=items.slice(6),out=''; top.forEach(function(it,i){ out+=lg(PALETTE[i],it.name,it.total,grand); }); if(rest.length){ var rt=rest.reduce(function(s,x){return s+x.total;},0); out+=lg(REST_COLOR,'其他 '+rest.length+' 項',rt,grand); } return out; }
  function lg(color,name,total,grand){ var pct=grand>0?Math.round(total/grand*100):0; return '<div class="lg"><span class="sw" style="background:'+color+'"></span><span class="lg-name">'+esc(name)+'</span><span class="lg-amt num">$'+fmt(total)+'</span><span class="lg-pct num">'+pct+'%</span></div>'; }
  function kpi(label,valHtml,subHtml,cls){ return '<div class="kpi"><div class="k-label">'+label+'</div><div class="k-value num '+(cls||'')+'">'+valHtml+'</div>'+(subHtml||'')+'</div>'; }

  function categoryTab(){
    var r=resolveScope(state.scope), partial=isPartialCur(r);
    var grossExp=sumScope(function(t){return t.type==='支出';},r);
    var refunds=sumScope(isRefund,r);
    var expTotal=grossExp-refunds;
    var incTotal=sumScope(isIncome,r);
    var net=incTotal-expTotal;
    var expList=TXNS.filter(function(t){return t.type==='支出'&&inScope(t,r);});
    var incCount=TXNS.filter(function(t){return isIncome(t)&&inScope(t,r);}).length, expCount=expList.length;
    var pr=prevScope(r), pExp=pr?(sumScope(function(t){return t.type==='支出';},pr,pr.upto)-sumScope(isRefund,pr,pr.upto)):0, pInc=pr?sumScope(isIncome,pr,pr.upto):0;

    var subs=recurring(), subTot=subs.reduce(function(s,x){return s+x.amt;},0), subNames={}; subs.forEach(function(x){ subNames[x.name]=1; });
    var dim=daysInMonth(r.year,r.month), proj=isCurMonth(r)?projectMonth(expList,Math.min(NOW.day,dim),dim,subNames,subTot)-refunds:null;
    var projNet = proj!=null ? incTotal-proj : net;
    var saveRate, saveLbl, saveNote='';
    if(partial && incTotal>0 && proj!=null){ saveRate=Math.round(projNet/incTotal*100); saveLbl='預估儲蓄率'; saveNote='<div class="k-sub2">基於預估月底支出</div>'; }
    else { saveRate=incTotal>0?Math.round(net/incTotal*100):null; saveLbl='儲蓄率'; }

    var expSub='<div class="k-sub">'+deltaStr(expTotal,pExp,true,partial)+'</div>'+(refunds>0?'<div class="k-sub2 num">已折抵退款 −$'+fmt(refunds)+'</div>':'');
    var avgPer=expCount?Math.round(grossExp/expCount):0;

    var h='<div class="kpis">'
      + kpi('總支出','$'+fmt(expTotal), expSub, 'spend')
      + kpi('總收入','$'+fmt(incTotal), '<div class="k-sub">'+deltaStr(incTotal,pInc,false,partial)+'</div>', 'income')
      + kpi('結餘',(net>=0?'+':'−')+'$'+fmt(Math.abs(net)),
          '<div class="k-sub">'+saveLbl+' '+(saveRate!=null?saveRate+'%':'—')+'</div>'+(saveRate!=null?'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,saveRate))+'%;background:'+meterColor(saveRate)+'"></i></div>':'')+saveNote,
          net>=0?'pos':'neg')
      + kpi('交易筆數', fmt(expCount+incCount), '<div class="k-sub num">平均支出 $'+fmt(avgPer)+'/筆</div>', '')
      + '</div>';

    if(proj!=null){
      h+='<div class="projstrip"><span class="pl">本月預估</span>'
       +'<span class="pv">月底支出 <span class="num" style="color:var(--spend)">$'+fmt(proj)+'</span></span>'
       +'<span class="pv">預估結餘 <span class="num" style="color:'+(projNet>=0?'var(--income)':'var(--spend)')+'">'+(projNet>=0?'+':'−')+'$'+fmt(Math.abs(projNet))+'</span></span>'
       +'<span class="pn">已過 '+NOW.day+'/'+dim+' 天 · 大額一次性與訂閱未納入日均外推</span></div>';
    }

    var map={}; expList.forEach(function(t){ if(!map[t.cat])map[t.cat]={total:0,count:0}; map[t.cat].total+=t.amount; map[t.cat].count++; });
    var items=Object.keys(map).map(function(k){return {name:k,total:map[k].total,count:map[k].count};}).sort(function(a,b){return b.total-a.total;});

    h+='<div class="grid2">'
      +'<div class="panel"><h3>支出分類 · 類別 <span class="h3note">'+(refunds>0?'毛額 $'+fmt(grossExp)+' − 退款 $'+fmt(refunds):'')+'</span></h3><div class="donut-wrap">'+donut(items,grossExp,'支出毛額')+'<div class="legend">'+legend(items,grossExp)+'</div></div></div>'
      +'<div class="panel"><h3 class="inc">收入來源</h3>'+incomeList(TXNS.filter(function(t){return isIncome(t)&&inScope(t,r);}),incTotal)+'</div>'
      +'</div>';

    h+='<div class="panel" style="margin-bottom:var(--sp4)"><h3>每月收支趨勢 <span class="h3note">'+trendMaxNote(r,subNames,subTot)+'</span></h3>'+trendChart(r,subNames,subTot)+'</div>';

    var transfers = TXNS.filter(function(t){ return t.type==='轉帳'&&inScope(t,r); }).sort(function(a,b){return b.amount-a.amount;});
    if(transfers.length){ var trTot=transfers.reduce(function(s,t){return s+t.amount;},0);
      h+='<div class="panel" style="margin-bottom:var(--sp4)"><h3>轉帳 <span class="h3note">帳戶間搬移 · 不計入收支</span></h3>';
      transfers.slice(0,20).forEach(function(t){ h+='<div class="lrow"><span class="badge">'+t.bank+'</span><span class="ln">'+esc(t.merchant||'轉帳')+'</span><span class="ls num">'+t.y+'/'+('0'+t.m).slice(-2)+'/'+('0'+t.d).slice(-2)+'</span><span class="la num">$'+fmt(t.amount)+'</span></div>'; });
      h+='<div class="ltot"><span class="t-l">轉帳合計('+transfers.length+' 筆)</span><span class="t-v num">$'+fmt(trTot)+'</span></div></div>'; }
    h+='<button class="moretog" data-more>'+(state.more?'▲ 收合分析':'▾ 更多分析:定期訂閱 · Top 商店')+'</button>';
    if(state.more){
      h+='<div class="grid2"><div class="panel"><h3>定期訂閱 <span class="h3note">每月固定 · 年約 $'+fmt(subTot*12)+'</span></h3>'+subPanel(subs,subTot)+'</div>'
        +'<div class="panel"><h3>Top 商店 <span class="h3note">本範圍</span></h3>'+topMerchants(expList)+'</div></div>';
    }

    h+='<div class="toolbar"><h2>'+(state.q?'搜尋結果':'支出明細 · 依類別 <span class="th">點類別看該類交易</span>')+'</h2><input class="search" id="q" placeholder="搜尋商店…" value="'+esc(state.q)+'"></div>';
    if(state.q){
      var hits=expList.filter(function(t){return t.merchant.toLowerCase().indexOf(state.q.toLowerCase())>=0;}).sort(function(a,b){return b.amount-a.amount;});
      if(!hits.length) h+='<div class="empty">找不到「'+esc(state.q)+'」的交易</div>';
      else { h+='<div class="panel"><div class="rc-meta num" style="margin-bottom:var(--sp2)">'+hits.length+' 筆 · 合計 $'+fmt(sum(hits))+'</div>'; hits.slice(0,40).forEach(function(t){ h+=txnRow(t,true); }); h+='</div>'; }
    } else {
      if(!items.length) h+='<div class="empty">此範圍沒有支出</div>';
      else { var max=items[0].total; items.forEach(function(it,i){ h+=rowCard(it,i,max,expList); }); }
    }
    return h;
  }
  function txnRow(t,showCat){ return '<div class="txn"><span class="badge">'+t.bank+'</span><span class="m">'+esc(t.merchant)+(showCat?' <span class="cat">'+esc(t.cat)+'</span>':'')+(t.tag?' <span class="cat">'+esc(t.tag)+'</span>':'')+'</span><span class="d num">'+t.y+'/'+('0'+t.m).slice(-2)+'/'+('0'+t.d).slice(-2)+'</span><span class="a num">$'+fmt(t.amount)+'</span>'+manualDelBtn(t)+'</div>'; }
  function deltaStr(cur,prev,spend,partial){
    if(!prev) return '無前期可比';
    if(Math.abs(prev)<500){ var diff=cur-prev; return 'vs 前期 '+(diff>=0?'+':'−')+'$'+fmt(Math.abs(diff)); }
    var d=Math.round((cur-prev)/prev*100), suf=partial?' <span style="opacity:.7">(同期)</span>':'';
    if(d===0) return 'vs 前期 持平'+suf; var up=d>0; var cls=spend?(up?'up':'down'):(up?'down':'up');
    return 'vs 前期 <span class="delta '+cls+'">'+(up?'▲':'▼')+Math.abs(d)+'%</span>'+suf;
  }
  function incomeList(list,incTotal){ if(!list.length) return '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">此範圍沒有收入</div>'; var imap={}; list.forEach(function(t){ imap[t.cat]=(imap[t.cat]||0)+t.amount; }); var items=Object.keys(imap).map(function(k){return {name:k,total:imap[k]};}).sort(function(a,b){return b.total-a.total;}); var out=''; items.forEach(function(it){ var pct=incTotal>0?it.total/incTotal*100:0; out+='<div style="padding:6px 0;border-bottom:1px solid var(--border)"><div class="lrow" style="padding:0;border:none"><span class="ln">'+esc(it.name)+'</span><span class="la inc num">$'+fmt(it.total)+'</span></div><div class="sharebar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>'; }); out+='<div class="ltot"><span class="t-l">收入合計</span><span class="t-v num" style="color:var(--income)">$'+fmt(incTotal)+'</span></div>'; return out; }
  function monthsBack(n){ var arr=[],y=NOW.year,mm=NOW.month; for(var i=0;i<n;i++){ arr.unshift({y:y,m:mm}); mm--; if(mm<1){mm=12;y--;} } return arr; }
  function trendData(r,subNames,subTot){ var months=r.level==='year'?(function(){ var a=[],last=(r.year===NOW.year)?NOW.month:12; for(var m=1;m<=last;m++)a.push({y:r.year,m:m}); return a; })():monthsBack(6); return months.map(function(o){ var e=0,in_=0,exps=[]; TXNS.forEach(function(t){ if(t.y===o.y&&t.m===o.m){ if(t.type==='支出'){e+=t.amount; exps.push(t);} else if(isIncome(t)) in_+=t.amount; } }); var dim=daysInMonth(o.y,o.m); var part=(o.y===NOW.year&&o.m===NOW.month&&NOW.day<dim); var proj=part?projectMonth(exps,NOW.day,dim,subNames||{},subTot||0):e; return {label:o.m+'月',exp:e,inc:in_,partial:part,proj:proj,net:in_-e}; }); }
  function trendMaxNote(r,sn,st){ var d=trendData(r,sn,st); var mx=Math.max.apply(null,d.map(function(x){return Math.max(x.proj,x.inc);})); return '單月上限 $'+fmt(mx); }
  function trendChart(r,sn,st){
    var data=trendData(r,sn,st), max=Math.max(1,Math.max.apply(null,data.map(function(d){return Math.max(d.proj,d.inc);})));
    var out='<div class="tgrid" style="top:18px"><span class="num">$'+fmt(max)+'</span></div><div class="tgrid" style="top:'+(18+54)+'px"><span class="num">$'+fmt(max/2)+'</span></div>';
    data.forEach(function(d){ var hi=Math.round(d.inc/max*108), he=Math.round(d.exp/max*108), hp=d.partial?Math.round((d.proj-d.exp)/max*108):0;
      var expTop=(hp>0?'0 0 0 0':'2px 2px 0 0');
      // fmt() is numeric-only (Math.round().toLocaleString()), so the 'k' suffix must be
      // appended AFTER formatting — passing "196k" back into fmt() yields NaN.
      var netc=d.net>=0?'var(--income)':'var(--spend)', an=Math.abs(d.net), nets=(d.net>=0?'+':'−')+'$'+(an/1000>=1?fmt(an/1000)+'k':fmt(an));
      out+='<div class="tcol'+(d.partial?' partial':'')+'"><div class="tbars"><i class="b-inc" style="height:'+Math.max(2,hi)+'px" title="收入 $'+fmt(d.inc)+'"></i><div class="spendstack">'+(hp>0?'<i class="b-proj" style="height:'+hp+'px" title="預估再增 $'+fmt(d.proj-d.exp)+'"></i>':'')+'<i class="b-exp" style="height:'+Math.max(2,he)+'px;border-radius:'+expTop+'" title="支出 $'+fmt(d.exp)+'"></i></div></div><div class="tlabel">'+d.label+(d.partial?' 至今':'')+'</div><div class="tnetv" style="color:'+netc+'" title="淨額 '+(d.net>=0?'+':'−')+'$'+fmt(Math.abs(d.net))+'">淨'+nets+'</div></div>'; });
    return '<div class="trend">'+out+'</div><div class="tlegend"><span><i style="background:var(--income)"></i>收入</span><span><i style="background:var(--spend)"></i>支出</span><span><i class="proj"></i>月底預估</span><span>「淨」=當月收支差</span></div>';
  }
  function recurring(){ var m={}; TXNS.filter(function(t){return t.type==='支出';}).forEach(function(t){ var k=t.y+'-'+('0'+t.m).slice(-2); if(!m[t.merchant])m[t.merchant]={}; m[t.merchant][k]=(m[t.merchant][k]||0)+t.amount; }); var recent=monthsBack(6).map(function(o){return o.y+'-'+('0'+o.m).slice(-2);}); var last2=recent.slice(-2); var out=[]; Object.keys(m).forEach(function(name){ var present=recent.filter(function(k){return m[name][k]!=null;}); if(present.length<4) return; if(!last2.some(function(k){return m[name][k]!=null;})) return; var amts=present.map(function(k){return m[name][k];}); var med=median(amts); if(amts.every(function(a){return Math.abs(a-med)<=med*0.12;})) out.push({name:name,amt:med}); }); return out.sort(function(a,b){return b.amt-a.amt;}); }

  // optimistic edit: update local state now, write back, revert on failure
  function applyEdit(id,field,value){
    var t=txnById(id); if(!t) return;
    var prev=t[field]; t[field]=value;

    var perDay={}; TXNS.forEach(function(t){ if(t.type==='支出'&&t.y===y&&t.m===m) perDay[t.d]=(perDay[t.d]||0)+t.amount; });
    var maxDay=0; for(var dm=1;dm<=lastDay;dm++) maxDay=Math.max(maxDay,perDay[dm]||0);
    var first=new Date(y,m-1,1).getDay(), dows=['日','一','二','三','四','五','六'];
    var grid='<div class="cal">'; dows.forEach(function(w){ grid+='<div class="dow">'+w+'</div>'; });

      h+=d+'</div>';
    });
    return h;
  }
  function monthlyBars(byMonth,color){ var keys=Object.keys(byMonth).sort().slice(-8); if(!keys.length) return ''; var max=Math.max.apply(null,keys.map(function(k){return byMonth[k];}))||1; var out='<div style="font-size:12px;color:var(--text-muted);margin-bottom:2px">每月新增</div><div class="mbars">'; keys.forEach(function(k){ var hgt=Math.round(byMonth[k]/max*46); out+='<div class="mb"><i style="height:'+Math.max(2,hgt)+'px;background:'+color+'" title="'+k+' $'+fmt(byMonth[k])+'"></i><span>'+(+k.split('-')[1])+'月</span></div>'; }); out+='</div>'; return out; }

  function render(){
    var r=resolveScope(state.scope), tab=state.tab, isProj=tab==='project';
    var periodTxt = isProj ? (state.projScope==='year'?NOW.year+' 年 · 項目累計':'全部期間 · 項目累計') : esc(periodLabel(r));
    function tb(id,tt,sub){ return '<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'"><span class="tt">'+tt+'</span><span class="tsub">'+sub+'</span></button>'; }
    var h='<div class="head"><div class="head-top"><span class="title">交易 Dashboard</span><span style="display:flex;align-items:center;gap:var(--sp3)"><span class="period">'+periodTxt+'</span><button class="addbtn" data-add>＋ 新增</button></span></div>'
      +'<div class="tabs">'+tb('category','類別','這段期間錢花在哪類?')+tb('project','項目 (TAG)','某個目標累計花了多少?')+tb('analysis','分析','卡別 · 熱力圖 · 排行')+'</div>';
    if(!isProj){
      h+='<div class="controls"><span class="clabel">期間</span><button class="ctl'+(state.scope==='all'?' active':'')+'" data-scope="all">全部</button><button class="ctl'+(state.scope==='month'?' active':'')+'" data-scope="month">當月</button><button class="ctl'+(state.scope==='year'?' active':'')+'" data-scope="year">當年</button><span class="clabel" style="margin-left:6px">或指定</span><span class="sel'+(isPick()?' picked':' dim')+'"><select id="selYear">'+yearOptions()+'</select><select id="selMonth">'+monthOptions()+'</select></span></div>';
    } else {
      h+='<div class="controls"><span class="clabel">範圍</span><button class="ctl'+(state.projScope==='all'?' active':'')+'" data-pscope="all">全部累計</button><button class="ctl'+(state.projScope==='year'?' active':'')+'" data-pscope="year">本年</button><span class="hint">項目為長期累計,與期間篩選分開</span></div>';
    }
    h+='</div>';
    h+= tab==='category' ? categoryTab() : (tab==='analysis' ? analysisTab() : projectTab());
    h+='<div class="footer">即時讀取自 Transactions · 冷石板深色</div>';
    document.getElementById('app').innerHTML=h; attach();
  }
  function attach(){
    var app=document.getElementById('app');
    app.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ state.tab=this.getAttribute('data-tab'); openRow=null; openProj=null; openHeatDay=null; state.q=''; render(); }; });
    app.querySelectorAll('.ctl[data-scope]').forEach(function(b){ b.onclick=function(){ var s=this.getAttribute('data-scope'); state.scope=s; if(s==='year'){state.selYear=NOW.year;state.selMonth=0;} else if(s==='month'){state.selYear=NOW.year;state.selMonth=NOW.month;} openRow=null; openHeatDay=null; render(); }; });
    app.querySelectorAll('.cell[data-hday]').forEach(function(c){ c.onclick=function(){ var d=this.getAttribute('data-hday'); openHeatDay=(openHeatDay===d)?null:d; render(); }; });
    var sdBtn=app.querySelector('[data-showdone]'); if(sdBtn) sdBtn.onclick=function(){ state.showDone=!state.showDone; render(); };
    app.querySelectorAll('select[data-ef]').forEach(function(s){ s.onchange=function(){ applyEdit(this.getAttribute('data-id'), this.getAttribute('data-ef'), this.value); }; });
    app.querySelectorAll('[data-emer]').forEach(function(i){
      i.onchange=function(){ applyEdit(this.getAttribute('data-emer'),'merchant',this.value.trim()); };
      i.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); this.blur(); } else if(e.key==='Escape'){ this.value=this.defaultValue; this.blur(); } };
    });
    app.querySelectorAll('[data-erec]').forEach(function(b){ b.onclick=function(){ var id=this.getAttribute('data-erec'); var t=txnById(id); if(t) applyEdit(id,'posted',!t.posted); }; });
    var addB=app.querySelector('[data-add]'); if(addB) addB.onclick=openAddModal;
    app.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); deleteTxnRow(this.getAttribute('data-del')); }; });
    app.querySelectorAll('.ctl[data-pscope]').forEach(function(b){ b.onclick=function(){ state.projScope=this.getAttribute('data-pscope'); openProj=null; render(); }; });
    var mt=app.querySelector('[data-more]'); if(mt) mt.onclick=function(){ state.more=!state.more; render(); };
    var sy=document.getElementById('selYear'), sm=document.getElementById('selMonth');
    function pickSel(){ state.selYear=+sy.value; state.selMonth=+sm.value; state.scope=state.selMonth===0?String(state.selYear):(state.selYear+'-'+('0'+state.selMonth).slice(-2)); openRow=null; openHeatDay=null; render(); }
    if(sy) sy.onchange=pickSel; if(sm) sm.onchange=pickSel;
    var q=document.getElementById('q'); if(q) q.oninput=function(){ state.q=this.value; var pos=this.selectionStart; render(); var q2=document.getElementById('q'); if(q2){ q2.focus(); try{q2.setSelectionRange(pos,pos);}catch(e){} } };
    app.querySelectorAll('.row-card').forEach(function(c){ c.onclick=function(e){ if(e.target.id==='q')return; var n=this.getAttribute('data-row'); openRow=(openRow===n)?null:n; render(); }; });
    app.querySelectorAll('.pcard').forEach(function(c){ c.onclick=function(){ var n=this.getAttribute('data-proj'); openProj=(openProj===n)?null:n; render(); }; });
  }

  // ---------- boot: fetch real data, then render ----------
  function boot(){
    document.getElementById('app').innerHTML = '<div class="loading">載入中…</div>';
    google.script.run
      .withSuccessHandler(function(data){ TXNS = (data||[]).map(function(t){ t.y=+t.y; t.m=+t.m; t.d=+t.d; t.amount=+t.amount; t.posted = (t.posted===true); t.id = String(t.id||''); return t; }); render(); })
      .withFailureHandler(function(err){
        var msg = (err && err.message) ? err.message : String(err);
        document.getElementById('app').innerHTML =
          '<div class="error">載入失敗:' + esc(msg) + '<br>請重新整理再試。</div>';
      })
      .getAllTxns();
  }
  document.getElementById('a-cancel').onclick=closeAddModal;
  document.getElementById('a-save').onclick=submitAdd;
  document.getElementById('addOverlay').onclick=function(e){ if(e.target===this) closeAddModal(); };
  boot();
</script>
</body>
</html>
