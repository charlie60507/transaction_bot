   * There is no page-global busy flag: the per-row intent already blocks a double send, and a
   * second row's delete confirmed meanwhile must not be dropped.

  }
  /** A write ahead of a queued delete failed: the row returns to normal. The delete modal is not

  }
  function trySendDelete(rowKey){

    if(!t){ delete ROW_DELETE_INTENTS[rowKey]; return; }

    intent.sent=true; var serverId=resolveTextRowId(rowKey);
    var delSeq=nextMutation();

      .withSuccessHandler(function(res){

        settle(delSeq, res && res.txns, res && res.olderFp);

        TXNS=TXNS.filter(function(x){ return x._textKey!==rowKey; });

      })

  /** Pure: a copy of `list` with the item at `from` moved to `to` (clamped). The input is not changed. */
  function reorderList(list, from, to){
    var next=(list||[]).slice();
    if(!(from>=0&&from<next.length)) return next;
    to=Math.max(0,Math.min(next.length-1,to));
    var item=next.splice(from,1)[0]; next.splice(to,0,item);
    return next;
  }
  /** Pure: the index a row dragged from `from` by `dy` px lands on, rows `rowHeight` apart, clamped to
   *  [0, count-1]. */
  function dropIndex(from, dy, rowHeight, count){
    if(!(count>0)) return 0;
    var to=from+(rowHeight>0?Math.round(dy/rowHeight):0);
    return Math.max(0,Math.min(count-1,to));
  }

  /**

  function sheetLink(){
    return '<a class="sheet-link" href="'+esc(SHEET_URL)+'" target="_blank" rel="noopener" title="Open spreadsheet" aria-label="Open spreadsheet">'
      +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<rect x="3" y="3" width="18" height="18" rx="2"/>'
      +'<path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'
      +'</svg></a>';
  }
  function editRow(t){
    function canCorrectAmount(row){ return !!(row && ['支出','轉帳'].indexOf(row.type)!==-1); }
    // Keep editRow() extractable for the small offline fixtures that render it in isolation.
    // In the real panel TEXT_DRAFTS exists; an isolated fixture intentionally has no drafts.
    var textRow=(typeof ensureTextRowKey==='function')?ensureTextRowKey(t):String(t.id);
    function currentText(field){
      var drafts=(typeof TEXT_DRAFTS==='undefined')?{}:TEXT_DRAFTS;
      var d=drafts[String(textRow)+'\u001f'+field];
      return d?d.value:(t[field]||'');
    }
    var tc=typeColor(t.type);
    // While its delete is in flight the row stays visible but inert: every control renders
    // disabled, the split affordance is plain text and 刪除中… stands where the 🗑 was.
    var deleting=(typeof isRowDeleting==='function')&&isRowDeleting(t), dis=deleting?' disabled':'';
    var compactAmount=(t.type==='轉帳')
      ? '<span class="amt num" style="color:'+tc+'">$'+fmt(t.amount)+'</span>'
      : deleting
        ? '<span class="amt num" style="color:'+tc+'">'+(t.type==='收入'?'+':'')+'$'+fmt(t.amount)+splitMark(t)+'</span>'
        : '<button type="button" class="amt amtbtn num" data-amt="'+esc(textRow)+'" style="color:'+tc+'" title="點金額拆分代墊">'+(t.type==='收入'?'+':'')+'$'+fmt(t.amount)+splitMark(t)+'</button>';
    return '<div class="erow'+(t.posted?' done':'')+(deleting?' deleting':'')+'" data-erow="'+esc(t.id)+'"'+(deleting?' aria-busy="true"':'')+'>'
      // The expense amount IS the split control. ~5 of ~100 rows a month are split, so a permanent
      // input would ask a question whose answer is "no" 95% of the time; an unsplit row must
      // stay exactly as it was. Transfers keep the visible amount but not this expense-only
      // affordance. The whole affordance is a dashed underline on hover.
      // The time answers "which of this day's rows is this one" — 94% of transactions land on
      // a day that holds more than one. Rendered only when the row actually has a time, so the
      // pre-June rows look exactly as they do today. Shown to the minute: 富邦 gives seconds and
      // 國泰 does not, so seconds would advertise a precision most timed rows do not have.
      +'<div class="er1"><span class="badge">'+esc(t.bank)+' •'+esc(t.last4)+'</span>'+(t.hm?'<span class="ehm num">· '+esc(t.hm)+'</span>':'')+'<input class="merin" data-emer="'+esc(t.id)+'" data-trow="'+esc(textRow)+'" value="'+esc(currentText('merchant'))+'" placeholder="(無說明)" spellcheck="false"'+dis+'>'+mailLink(t)+compactAmount+'</div>'
      +(t.type==='支出' && openSplit===textRow ? splitBox(t, deleting) : '')
      +'<div class="er2">'
        +(canCorrectAmount(t)?'<div class="fld"><span class="lb">金額</span><input class="amtcor num" type="number" inputmode="decimal" min="0.01" step="0.01" data-ef="amount" data-id="'+esc(t.id)+'" data-trow="'+esc(textRow)+'" value="'+esc(t.amount)+'" aria-label="金額"'+dis+'></div>':'')
        // The 類別 chip opens the icon picker (attach() → openCatPicker), which saves through the same
        // applyEdit(id,'cat',value) the select used. catChipInner is guarded for isolated fixtures.
        +'<div class="fld"><span class="lb">類別</span><button type="button" class="catchip" data-catpick="'+esc(textRow)+'" data-id="'+esc(t.id)+'" aria-label="類別：'+esc(t.cat||'未分類')+'，點擊更改"'+dis+'>'
          +((typeof catChipInner==='function')?catChipInner(t.cat||'未分類'):esc(t.cat||'未分類')+' ▾')+'</button></div>'
        +'<div class="fld"><span class="lb">收支</span><select data-ef="type" data-id="'+esc(t.id)+'" data-trow="'+esc(textRow)+'" style="color:'+tc+'"'+dis+'>'+selOpts(['支出','收入','轉帳'],t.type)+'</select></div>'
        +'<button class="erec" data-erec="'+esc(t.id)+'" data-trow="'+esc(textRow)+'"'+dis+'>'+(t.posted?'↩ 取消記帳':'✓ 記帳')+'</button>'
        +(deleting?'<span class="txdeleting" role="status">刪除中…</span>':delBtn(t))
      +'</div></div>';
  }
  /**
   * Everything spent on one day, no 已記帳 filter.
   *
   * This used to show only the un-recorded rows with a toggle to reveal the rest, because it was
   * the ONLY place a transaction could be recorded. The 待記帳 tab owns that job now, so filtering
   * here only hid the answer to the question the heatmap actually asks — what did this day cost.
   * Rows stay editable (that is where an inline title fix belongs), but nothing is withheld and
   * recorded rows are not dimmed, since by now almost every row is recorded.
   */
  /**
   * How the rows of ONE day are ordered, in both surfaces that list a day: the heatmap day
   * editor and the 待記帳 queue. One function, two call sites — they each held their own copy
   * of the amount sort, which is exactly how two views that must agree drift apart.
   *
   * Time ascending, and '' (no time) sorts first, which is where midnight belongs anyway.
   * THE AMOUNT TIEBREAK IS LOAD-BEARING, not decoration: 82% of rows carry no time and so
   * share one primary key, and sort is stable — without the tiebreak they would fall back to
   * sheet order (an artefact of how the bot appends and re-sorts) and the whole pre-June
   * history would silently lose the ordering it has today. With it, a day with no times looks
   * exactly as it always did and only days that actually carry times reorder.
   */
  function byTimeThenAmount(a,b){
    var ha=a.hm||'', hb=b.hm||'';
    if(ha!==hb) return ha<hb?-1:1;
    return b.amount-a.amount;
  }
  function dayEditor(y,m,sd){
    var all=TXNS.filter(function(t){ return t.y===y&&t.m===m&&t.d===sd; })
                .sort(byTimeThenAmount);
    var pendN=all.filter(function(t){ return !t.posted; }).length;
    var spendList=all.filter(isConsumption);
    var spend=spendList.reduce(function(s,t){ return s+t.amount; },0);
    var advDay=advIn(spendList);
    var iso=y+'-'+('0'+m).slice(-2)+'-'+('0'+sd).slice(-2);
    // The add-on-this-day action lives here, in the detail header, not inside a calendar cell
    // where it overlapped the day number and the spend colour.
    var h='<div class="hdetail"><div class="ev-head"><span class="lbl">'+m+' / '+sd+' 當天 · <b style="color:var(--text-primary)">'+all.length+'</b> 筆 · 支出 <b class="num" style="color:var(--text-primary)">$'+fmt(spend)+'</b>'
      +(advDay>0?' <span class="orig num">刷卡 $'+fmt(spend+advDay)+'</span>':'')
      +(pendN?' · 其中 <b style="color:var(--spend)">'+pendN+'</b> 筆待記帳':'')+'</span>'
      +'<button type="button" class="dayadd" data-dayadd="'+iso+'">＋ 在這天新增</button></div>';
    if(!all.length){ return h+'<div class="empty" style="padding:var(--sp4) 0">這天沒有交易</div></div>'; }
    all.forEach(function(t){ h+=editRow(t); });
    return h+'</div>';
  }

  // ---------- 待記帳 inbox: every un-recorded txn, ANY date, in ONE list ----------
  // The heatmap is the calendar entrance for posted rows of any 收支別. This view is the
  // unbounded backlog — it also removes the day-at-a-time clicking a multi-day queue used to need.
  var DOW = ['日','一','二','三','四','五','六'];
  function pendingTxns(){ return TXNS.filter(function(t){ return !t.posted; }); }
  function dayKeyOf(t){ return t.y+'-'+('0'+t.m).slice(-2)+'-'+('0'+t.d).slice(-2); }
  function daysAgo(t){ return Math.round((Date.UTC(NOW.year,NOW.month-1,NOW.day)-Date.UTC(t.y,t.m-1,t.d))/86400000); }
  function ageLabel(n){ return n<=0?'今天':(n===1?'昨天':n+' 天前'); }

  // Mark a whole day recorded. Writes are sequential, not parallel: Apps Script serializes
  // sheet writes anyway, and one at a time means a mid-way failure reverts exactly one row.
  function bulkPost(ids){
    // A row being deleted is left out before the optimistic tick, not only at send time: ticking
    // it would flash 已記帳 on a row that is about to disappear.
    var todo = ids.map(function(id){ var t=txnById(id); if(!t||t.posted) return null;
      var rowKey=ensureTextRowKey(t); return ROW_DELETE_INTENTS[rowKey]?null:rowKey; }).filter(Boolean);
    if(!todo.length) return;
    todo.forEach(function(rowKey){ var t=textTxn(rowKey); t.posted=true; });
    render();
    var failed = 0;
    (function step(i){
      if(i >= todo.length){
        if(failed) { repaint(); toast('完成 '+(todo.length-failed)+'/'+todo.length+' · '+failed+' 筆寫入失敗', true); }
        else toast('已記帳 '+todo.length+' 筆');
        return;
      }
      // Two arguments on purpose: bulk post ignores the return value, so it must not pay for a
      // full list per row. The counter still moves, so an edit response issued before this run
      // cannot be adopted on top of the rows it just marked — and settling each row through
      // settle() is what turns that dropped list into one refetch rather than a stale row id.
      // Nothing is refetched on the ordinary run: the debt only exists after a real drop.
      var rowKey=todo[i], current=textTxn(rowKey);
      if(!current||ROW_DELETE_INTENTS[rowKey]){ step(i+1); return; }
      var seq=nextMutation();
      enqueueRowWrite(rowKey,function(done){
      var serverId=resolveTextRowId(rowKey);
      google.script.run
        .withSuccessHandler(function(){ settle(seq, null); done(); step(i+1); })
        .withFailureHandler(function(){ settle(seq, null); var t=textTxn(rowKey); if(t) t.posted=false; if(ROW_DELETE_INTENTS[rowKey]) cancelDeleteIntent(rowKey); failed++; done(); step(i+1); })
        .updateTxn(serverId, { posted:true });
      });
    })(0);
  }

  // How far back the 已記帳 rows are shown. The pending list is deliberately UNBOUNDED — it is
  // the backlog and hiding part of it would defeat the view. Already-recorded rows are not:
  // showing every one of them means a thousand rows × three dropdowns each, so that side is
  // capped to the recent window, which is the only reason to look at them (undo a mis-tick).
  var INBOX_DONE_DAYS = 14;
  function inboxTab(){
    var pend = pendingTxns();
    var pool = state.inboxDone
      ? pend.concat(TXNS.filter(function(t){ return t.posted && daysAgo(t) <= INBOX_DONE_DAYS; }))
      : pend;
    if(state.inboxScope === 'year') pool = pool.filter(function(t){ return t.y === NOW.year; });
    // The queue is unbounded by date, so until the history is complete older pending rows may be
    // missing: the loaded ones stay listed and editable (that is what the fast first paint is
    // for), but the totals above them wait, and nothing claims the queue is empty.
    var partialQ = !HISTORY.complete && (state.inboxScope !== 'year' || !historyCovers(NOW.year,1));

    var pendScoped = pool.filter(function(t){ return !t.posted; });
    var pendSpend = pendScoped.filter(isConsumption).reduce(function(s,t){ return s+t.amount; },0);
    var oldest = pendScoped.slice().sort(function(a,b){ return dayKeyOf(a).localeCompare(dayKeyOf(b)); })[0];
    var dayCount = Object.keys(pendScoped.reduce(function(m,t){ m[dayKeyOf(t)]=1; return m; },{})).length;

    var wait = '<span class="hint">'+historyWaitText()+'</span>';
    var h = partialQ
      ? '<div class="kpis k3">'
        + kpi('待記帳筆數', wait, '', '') + kpi('待記帳支出', wait, '', '') + kpi('最舊一筆', wait, '', '')
        + '</div>'
      : '<div class="kpis k3">'
      + kpi('待記帳筆數', fmt(pendScoped.length), '<div class="k-sub">橫跨 '+dayCount+' 天</div>', pendScoped.length?'spend':'')
      + kpi('待記帳支出', '$'+fmt(pendSpend), '<div class="k-sub">含已分類轉帳</div>', 'spend')
      + kpi('最舊一筆', oldest?ageLabel(daysAgo(oldest)):'—',
            '<div class="k-sub">'+(oldest?oldest.y+'/'+oldest.m+'/'+oldest.d:'沒有積壓')+'</div>', '')
      + '</div>';
    if(partialQ) h += '<div class="hint" style="margin-bottom:var(--sp2)">'+historyWaitText()+' · 下面只列 '+historyFromText()+' 起的待記帳'+historyRetry()+'</div>';

    h += '<div class="toolbar"><h2>待記帳佇列 <span class="th">所有日期 · 最新的在最上面 · 改完按「✓ 已記帳」就消失</span></h2></div>';

    if(!pool.length && partialQ) return h + '<div class="empty">'+historyFromText()+' 起沒有待處理的交易 · '+historyWaitText()+historyRetry()+'</div>';
    if(!pool.length){
      return h + '<div class="empty">🎉 全部記帳完成,沒有待處理的交易。'
        + '<br><span style="font-size:12px">新的信件進來後會自動出現在這裡。</span></div>';
    }

    // group by day, newest day first; inside a day, chronological (same rule as the per-day editor)
    var groups = {};
    pool.forEach(function(t){ var k=dayKeyOf(t); (groups[k]=groups[k]||[]).push(t); });
    var keys = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });

    h += '<div class="panel">';
    keys.forEach(function(k){
      var list = groups[k].sort(byTimeThenAmount);
      var p = k.split('-'), y=+p[0], mo=+p[1], dy=+p[2];
      var open = list.filter(function(t){ return !t.posted; });
      var spend = open.filter(isConsumption).reduce(function(s,t){ return s+t.amount; },0);
      var dow = DOW[new Date(y,mo-1,dy).getDay()];
      h += '<div class="dsec"><span class="dd num">'+y+'/'+('0'+mo).slice(-2)+'/'+('0'+dy).slice(-2)+'</span>'
        + '<span class="dw">(週'+dow+')</span><span class="dage">· '+ageLabel(daysAgo({y:y,m:mo,d:dy}))+'</span>'
        + '<span class="dsum num">'+open.length+' 筆待記帳'+(spend?' · 支出 $'+fmt(spend):'')+'</span>'
        + (open.length>1 ? '<button class="dbulk" data-dbulk="'+k+'">✓ 整天記帳 ('+open.length+')</button>' : '')
        + '</div>';
      list.forEach(function(t){ h += editRow(t); });
    });
    return h + '</div>';
  }

  // Classify one month of TXNS for the heatmap. Intensity follows consumption eligibility;
  // clickability is "any row, any 收支別, not future".
  function heatDaysForMonth(txns, y, m, now, eligible){
    // Production passes isConsumption; the default preserves this pure helper's standalone API.
    eligible=eligible||function(t){ return t.type==='支出'; };
    var dim=daysInMonth(y,m), isCur=(y===now.year&&m===now.month);
    var perDay={}, hasTxn={}, hasExp={};
    txns.forEach(function(t){
      if(t.y!==y||t.m!==m) return;
      hasTxn[t.d]=true;
      if(eligible(t)){ hasExp[t.d]=true; perDay[t.d]=(perDay[t.d]||0)+t.amount; }
    });
    var days=[];
    for(var dd=1;dd<=dim;dd++){
      var future=isCur&&dd>now.day, v=perDay[dd]||0;
      var kind=future||!hasTxn[dd]?'inert':(hasExp[dd]?'spend-hit':'zero-spend-hit');
      days.push({d:dd, kind:kind, v:v, future:future});
    }
    return days;
  }
  // spend calendar heatmap: single-month scope only; current partial month renders future days inert
  function heatPanel(r,eligible){
    if(r.level!=='month') return '';
    var y=r.year, m=r.month, dim=daysInMonth(y,m);
    var isCur=(y===NOW.year&&m===NOW.month), lastDay=isCur?Math.min(NOW.day,dim):dim;
    var days=heatDaysForMonth(TXNS,y,m,NOW,eligible);
    var maxDay=0; days.forEach(function(x){ if(!x.future) maxDay=Math.max(maxDay,x.v); });
    var first=new Date(y,m-1,1).getDay(), dows=['日','一','二','三','四','五','六'];
    var grid='<div class="cal">'; dows.forEach(function(w){ grid+='<div class="dow">'+w+'</div>'; });
    for(var i=0;i<first;i++) grid+='<div class="cell void"></div>';
    var peak={d:0,v:0}, spentDays=0, total=0;
    days.forEach(function(x){
      var dd=x.d, v=x.v, future=x.future, today=isCur&&dd===NOW.day;
      if(!future){ total+=v; if(v>0) spentDays++; if(v>peak.v) peak={d:dd,v:v}; }
      var t=maxDay>0?v/maxDay:0, bg=(future||v<=0)?'var(--bg-raised)':blendSpend(0.18+t*0.72);
      // Every real day opens its detail, which lists the day's rows and carries the
      // ＋ 在這天新增 button; `hit` (days with rows) keeps the hover outline and the dot rule.
      var hit=x.kind!=='inert', sel=openHeatDay===(y+'-'+m+'-'+dd);
      var dot=x.kind==='zero-spend-hit';
      grid+='<div class="cell'+(future?' future':'')+(today?' today':'')+(hit?' hit':'')+(sel?' sel':'')+'" data-hday="'+y+'-'+m+'-'+dd+'" role="button" tabindex="0" aria-label="'+m+' 月 '+dd+' 日'+(future?'':' 支出 $'+fmt(v))+'" style="background:'+bg+'" title="'+y+'/'+m+'/'+dd+(future?'':' $'+fmt(v))+'"><span class="dn num">'+dd+'</span>'+(dot?'<i class="mark"></i>':'')+'</div>';
    });
    grid+='</div>';
    var tip='<div class="heat-tip"><span>最高:<b class="num">'+(peak.d?m+'/'+peak.d+' · $'+fmt(peak.v):'—')+'</b></span><span>有消費 <b class="num">'+spentDays+'</b> 天</span><span>日均 <b class="num">$'+fmt(lastDay?total/lastDay:0)+'</b></span><span style="margin-left:auto;opacity:.85">點日子看當天明細、新增交易</span></div>';
    var leg='<div class="heatlegend"><span>少</span><span class="sw" style="background:'+blendSpend(0.18)+'"></span><span class="sw" style="background:'+blendSpend(0.5)+'"></span><span class="sw" style="background:'+blendSpend(0.9)+'"></span><span>多</span></div>';
    var det='';
    if(openHeatDay){ var pp=openHeatDay.split('-'); if(+pp[0]===y&&+pp[1]===m){ det=dayEditor(y,m,+pp[2]); } }
    return grid+tip+leg+det;
  }

  function headSearch(){
    return '<input class="search" id="q" type="search" placeholder="搜尋…" aria-label="搜尋交易" value="'+esc(state.q)+'" spellcheck="false">';
  }
  function searchPanel(q){
    var hits=searchHits(TXNS,q), extra=Math.max(0,hits.length-SEARCH_CAP);
    var h='<div class="toolbar"><h2>搜尋結果 <span class="th">全期間 · 最新在前</span></h2></div>';
    // Until the history is complete the results come from the loaded rows only, and say so.
    if(!HISTORY.complete) h+='<div class="hint" style="margin-bottom:var(--sp2)">'+historyWaitText()+' · 目前只搜尋 '+historyFromText()+' 起的交易'+historyRetry()+'</div>';
    if(!hits.length) return h+'<div class="empty">找不到「'+esc(String(q).trim())+'」的交易</div>';
    h+='<div class="panel"><div class="rc-meta num" style="margin-bottom:var(--sp2)">'+hits.length+' 筆'+(extra?' · 還有 '+extra+' 筆':'')+'</div>';
    hits.slice(0,SEARCH_CAP).forEach(function(t){ h+=editRow(t); });
    return h+'</div>';
  }

  // ---------- period controls: 月 / 當年 / 全部 plus a ‹ label › stepper ----------
  /** The scope string for a month or a year: 'month' / 'year' for the current one (so the period
   *  follows the clock as before), 'YYYY-MM' / 'YYYY' for any other. */
  function monthScope(y,m){ return (y===NOW.year&&m===NOW.month)?'month':ymKey(y,m); }
  function yearScope(y){ return y===NOW.year?'year':String(y); }
  /** First month with a row, so the stepper stops there. The current month when there are none. */
  function firstDataKey(){
    var first=null;
    TXNS.forEach(function(t){ if(t.y&&t.m){ var k=ymKey(t.y,t.m); if(first==null||k<first) first=k; } });
    var now=ymKey(NOW.year,NOW.month);
    return (first==null||first>now)?now:first;
  }
  function setPeriod(level){
    var r=resolveScope(state.scope);
    if(r.level==='month'||r.level==='year') state.selYear=r.year;
    if(r.level==='month') state.selMonth=r.month;
    if(level==='month'){
      // From a year, land on its last month that has happened.
      var y=state.selYear, m=(y===NOW.year)?Math.min(state.selMonth,NOW.month):state.selMonth;
      state.scope=monthScope(y,m); state.selMonth=m;
    } else if(level==='year') state.scope=yearScope(state.selYear);
    else state.scope='all';
    openRow=null; openHeatDay=null; openProject=null;
  }
  function stepPeriod(dir){
    var r=resolveScope(state.scope);
    if(r.level==='month'){
      var k=addMonths(ymKey(r.year,r.month),dir), now=ymKey(NOW.year,NOW.month);
      if(k>now||k<firstDataKey()) return;
      var p=k.split('-'); state.selYear=+p[0]; state.selMonth=+p[1]; state.scope=monthScope(+p[0],+p[1]);
    } else if(r.level==='year'){
      var y=r.year+dir;
      if(y>NOW.year||y<+firstDataKey().split('-')[0]) return;
      state.selYear=y; state.scope=yearScope(y);
    } else return;
    openRow=null; openHeatDay=null; openProject=null;
  }
  function periodControls(){
    var r=resolveScope(state.scope), lv=r.level;
    function sb(level,label){ return '<button type="button" data-period="'+level+'" aria-pressed="'+(lv===level)+'">'+label+'</button>'; }
    var h='<div class="controls"><span class="seg" role="group" aria-label="期間">'+sb('month','月')+sb('year','當年')+sb('all','全部')+'</span>';
    if(lv!=='all'){
      var first=firstDataKey(), canPrev, canNext, label;
      if(lv==='month'){ var k=ymKey(r.year,r.month); canPrev=addMonths(k,-1)>=first; canNext=k<ymKey(NOW.year,NOW.month); label=r.year+' 年 '+r.month+' 月'; }
      else { canPrev=r.year>+first.split('-')[0]; canNext=r.year<NOW.year; label=r.year+' 年'; }
      h+='<span class="stepper"><button type="button" data-step="-1" aria-label="上一'+(lv==='month'?'個月':'年')+'"'+(canPrev?'':' disabled')+'>‹</button>'
        +'<span class="step-label num">'+label+'</span>'
        +'<button type="button" data-step="1" aria-label="下一'+(lv==='month'?'個月':'年')+'"'+(canNext?'':' disabled')+'>›</button></span>';
    } else h+='<span class="step-label">全部期間</span>';
    return h+'</div>';
  }

  function render(){
    var tab=state.tab, isInbox=tab==='inbox';
    var nPend=pendingTxns().length;
    function tb(id,tt,sub){ return '<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'" aria-pressed="'+(tab===id)+'"><span class="tt">'+tt+'</span>'+(sub?'<span class="tsub">'+sub+'</span>':'')+'</button>'; }
    // The badge counts every pending row of any date, so it waits for the whole history.
    var inboxSub = !HISTORY.complete ? historyWaitText() : (nPend ? '<span class="cnt">'+nPend+'</span>' : '');
    var settingsIcon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
    var h='<div class="head"><div class="head-top"><span class="title-row"><span class="title">交易 Dashboard</span>'+sheetLink()+'</span><span class="head-actions"><button class="settingsbtn" data-settings aria-label="開啟設定" title="設定">'+settingsIcon+'</button><button class="addbtn" data-add aria-label="新增交易">＋ 新增</button></span></div>'
      +'<div class="head-search">'+headSearch()+'</div>'
      +'<div class="tabs">'+tb('analysis','總覽','')+tb('trend','趨勢','')+tb('inbox','待記帳',inboxSub)+'</div>';
    if(isInbox){
      h+='<div class="controls"><span class="seg" role="group" aria-label="範圍"><button type="button" data-iscope="all" aria-pressed="'+(state.inboxScope==='all')+'">全部</button><button type="button" data-iscope="year" aria-pressed="'+(state.inboxScope==='year')+'">本年</button></span>'
        +'<button class="ev-toggle" data-inboxdone>'+(state.inboxDone?'只看待記帳':'一併顯示近 '+INBOX_DONE_DAYS+' 天已記帳')+'</button>'
        +'<span class="hint">'+(state.inboxDone?'已記帳只回看 '+INBOX_DONE_DAYS+' 天(誤按時取回用)':'待記帳與期間篩選分開,積壓不會被月份藏起來')+'</span></div>';
    } else {
      h+=periodControls();
    }
    // A failed background history read keeps one retry control in view whatever the tab.
    if(!HISTORY.complete&&HISTORY.failed) h+='<div class="hint">完整歷史載入失敗:'+esc(HISTORY.failed)+' · 需要完整歷史的數字暫不顯示'+historyRetry()+'</div>';
    h+='</div>';
    h+= String(state.q||'').trim() ? searchPanel(state.q)
      : (tab==='analysis' ? periodTab() : (tab==='trend' ? trendTab() : (tab==='inbox' ? inboxTab() : periodTab())));
    h+='<div class="footer">即時讀取自 Transactions · 冷石板深色</div>';
    document.getElementById('app').innerHTML=h; attach();
    // An open Settings sheet follows the page: its 專案 switches wait for the whole history.
    var so=document.getElementById('settingsOverlay'), list=document.getElementById('settings-category-list');
    if(so&&so.classList&&so.classList.contains('on')&&!CATEGORY_DRAG&&list&&!(list.contains&&list.contains(document.activeElement))) renderSettingsCategories();
  }

    app.querySelectorAll('.pj-row .drill').forEach(function(d){ d.onclick=function(e){ e.stopPropagation(); }; });
    app.querySelectorAll('[data-ef]').forEach(function(el){
      var field=el.getAttribute('data-ef'), id=el.getAttribute('data-trow')||el.getAttribute('data-id');
      el.onchange=function(e){ e.stopPropagation(); applyEdit(id,field,this.value); };
      if(el.tagName==='INPUT'){ el.onkeydown=function(e){ handleTextKeydown(e,this,id,field); }; }
    });
    app.querySelectorAll('[data-catpick]').forEach(function(b){
      var id=b.getAttribute('data-catpick');
      b.onclick=function(e){ e.stopPropagation(); if(this.disabled) return; openRowCatPicker(id); };
    });
    app.querySelectorAll('[data-emer]').forEach(function(i){
      var id=i.getAttribute('data-trow')||i.getAttribute('data-emer');
      i.oninput=function(e){ e.stopPropagation(); captureDraft(id,'merchant',this.value); };
      i.oncompositionstart=function(e){ e.stopPropagation(); beginComposition(id,'merchant',this.value); };
      i.oncompositionend=function(e){ e.stopPropagation(); endComposition(id,'merchant',this.value); };
      i.onchange=function(e){ e.stopPropagation(); if(consumeTextCancel(id,'merchant')) return; applyEdit(id,'merchant',this.value); };
      i.onblur=function(){ if(consumeTextCancel(id,'merchant')) return; saveTextDraft(id,'merchant'); };
      i.onkeydown=function(e){ handleTextKeydown(e,this,id,'merchant'); };
    });
    app.querySelectorAll('[data-erec]').forEach(function(b){ b.onclick=function(){ var id=this.getAttribute('data-trow')||this.getAttribute('data-erec'); var t=textTxn(id); if(t) commitRow(id,!t.posted); }; });
    // 我的消費: tapping the amount toggles the split editor open. Commit is Enter or 確定 only —
    // never blur, which on touch is part of the same tap heading for another control.
    // Only ONE split box is ever open (openSplit is a single id), so every lookup below is a
    // plain '.split .sin' — no need to build a selector out of the row id, which is a composite
    // key containing '|' and would need escaping this file has no precedent for.
    app.querySelectorAll('[data-amt]').forEach(function(b){ b.onclick=function(e){
      e.stopPropagation();
      var id=this.getAttribute('data-amt'); openSplit=(openSplit===id)?null:id; render();
      var inp=document.querySelector('.split .sin'); if(inp){ inp.focus(); inp.select(); }
    }; });
    app.querySelectorAll('[data-sok]').forEach(function(b){ b.onclick=function(e){
      e.stopPropagation();
      var box=this.parentNode, inp=box?box.querySelector('.sin'):null;
      applySplit(this.getAttribute('data-trow')||this.getAttribute('data-sok'), inp?inp.value.trim():'');
    }; });
    app.querySelectorAll('[data-scancel]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); openSplit=null; render(); }; });
    app.querySelectorAll('[data-sin]').forEach(function(inp){
      inp.onclick=function(e){ e.stopPropagation(); };
      inp.onkeydown=function(e){
        if(e.key==='Enter'){ e.preventDefault(); applySplit(this.getAttribute('data-trow')||this.getAttribute('data-sin'), this.value.trim()); }
        else if(e.key==='Escape'){ e.preventDefault(); openSplit=null; render(); }
      };
      // Live, non-blocking note. Consuming more than the card was charged is legitimate —
      // someone else fronted part of my share — so it explains rather than blocks.
      inp.oninput=function(){
        var t=textTxn(this.getAttribute('data-trow')||this.getAttribute('data-sin')); if(!t) return;
        var note=this.parentNode?this.parentNode.querySelector('.snote'):null; if(!note) return;
        var chg=chargedOf(t), v=Number(this.value.trim());
        if(this.value.trim()!=='' && isFinite(v) && v>chg){
          note.hidden=false; note.textContent='比刷卡金額多 $'+fmt(v-chg)+' — 有人先幫你墊了這部分，可以照樣送出';
        } else note.hidden=true;
      };
    });
    var addB=app.querySelector('[data-add]'); if(addB) addB.onclick=function(){ openAddModal(null); };
    app.querySelectorAll('[data-hretry]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); loadHistory(); render(); }; });
    var settingsB=app.querySelector('[data-settings]'); if(settingsB) settingsB.onclick=openSettingsModal;
    app.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); deleteTxnRow(this.getAttribute('data-trow')||this.getAttribute('data-del')); }; });
    app.querySelectorAll('[data-iscope]').forEach(function(b){ b.onclick=function(){ state.inboxScope=this.getAttribute('data-iscope'); render(); }; });
    var ibd=app.querySelector('[data-inboxdone]'); if(ibd) ibd.onclick=function(){ state.inboxDone=!state.inboxDone; render(); };
    app.querySelectorAll('[data-dbulk]').forEach(function(b){ b.onclick=function(){
      var k=this.getAttribute('data-dbulk');
      bulkPost(pendingTxns().filter(function(t){ return dayKeyOf(t)===k; }).map(function(t){ return t.id; }));
    }; });
    var q=document.getElementById('q');
    if(q){
      // Focus and caret used to be restored here by hand; repaint() now does that for every
      // control by identity, so this is the same behaviour without a second bespoke copy.
      q.oninput=function(){ state.q=this.value; repaint(); };
      q.onkeydown=function(e){ if(e.key==='Escape'){ e.preventDefault(); state.q=''; render(); } };
    }
    app.querySelectorAll('.row-card').forEach(function(c){ c.onclick=function(e){ if(e.target.id==='q')return; var n=this.getAttribute('data-row'); openRow=(openRow===n)?null:n; openCategoryTxn=null; openSplit=null; render(); }; });
    app.querySelectorAll('[data-category-txn]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); var id=this.getAttribute('data-category-txn'); openCategoryTxn=(openCategoryTxn===id)?null:id; openSplit=null; render(); }; });
    app.querySelectorAll('.row-card .drill').forEach(function(d){ d.onclick=function(e){ e.stopPropagation(); }; });
  }

  // ---------- boot: fetch real data, then render ----------
  /** Adopt a server list and report whether anything the page renders actually changed, so a
   *  write whose result matches the optimistic prediction repaints nothing. `olderFp` is the
   *  fingerprint that came with the list; a list without one (refreshTxns' getAllTxns) clears
   *  OLDER_FP, which costs the next edit one whole list and never a wrong one. */
  function adoptTxns(data, olderFp){
    var before=txnsSignature(TXNS);
    var next = (data||[]).map(function(t){ t.y=+t.y; t.m=+t.m; t.d=+t.d; t.amount=+t.amount;
      // charged/mine arrive from the server; default them so a page served before the
      // matching server version simply behaves as it did — every row "all mine".
      t.charged = (t.charged==null) ? t.amount : +t.charged;
      t.mine = (t.mine==null) ? null : +t.mine;
      // Same reasoning for hm: no time on any row makes the day sort's primary key uniformly
      // equal, so the amount tiebreak alone decides — which is exactly what this page did
      // before times existed. No blank badge, no undefined on screen, no NaN in the comparator.
      t.hm = (t.hm==null) ? '' : String(t.hm);
      t.posted = (t.posted===true); t.id = String(t.id||''); t.rowId=String(t.rowId||''); return t; });
    preservePendingAddRows(next); reconcileTextRowIds(TXNS,next); TXNS=next;
    OLDER_FP=(olderFp==null)?null:String(olderFp);
    return txnsSignature(TXNS)!==before;
  }
  /** First paint from the recent 13 months (getDashboardData's partial list), then the rest of the
   *  history in the background (loadHistory). A server answering with the whole list (no
   *  `complete: false`) needs no second read. The payload arrives as a JSON string (the server
   *  stringifies it; google.script.run is slow at serializing large nested objects). */
  function boot(){
    document.getElementById('app').innerHTML = '<div class="loading">載入中…</div>';
    google.script.run
      .withSuccessHandler(function(raw){
        var data=JSON.parse(raw);
        ACCOUNT_SOURCES=(data&&data.accounts)||[];
        CATEGORY_LIST=(data&&data.categories)||[];
        PROJECTS=(data&&data.projects)||[];
        BASELINE=(data&&data.baseline)||{ mode:'median', amount:null };
        var partial=!!(data&&data.complete===false&&data.before);
        HISTORY={ complete:!partial, before:partial?data.before:null, loadedFp:partial?data.loadedFp:null, loading:false, failed:null };
        adoptTxns(data&&data.txns, data&&data.olderFp); render();
        if(partial) loadHistory();
      })
      .withFailureHandler(function(err){
        var msg = (err && err.message) ? err.message : String(err);
        document.getElementById('app').innerHTML =
          '<div class="error">載入失敗:' + esc(msg) + '<br>請重新整理再試。</div>';
      })
      .getDashboardData({ sinceMonths: 13 });
  }

  };

  document.addEventListener('pointercancel',function(e){ if(CATEGORY_DRAG&&e.pointerId===CATEGORY_DRAG.id) endCategoryDrag(true); });
  document.getElementById('settingsOverlay').onclick=function(e){ if(e.target===this) closeSettingsModal(); };

    var c=e.target&&e.target.closest?e.target.closest('[data-catval]'):null;
    if(c) closeCatPicker(c.getAttribute('data-catval'));
  };
  document.addEventListener('keydown',catPickEscape,true);
  document.getElementById('d-cancel').onclick=closeDelModal;
  document.getElementById('d-ok').onclick=confirmDelete;
  document.getElementById('delOverlay').onclick=function(e){ if(e.target===this) closeDelModal(); };
  boot();
