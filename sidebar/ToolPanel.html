<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<title>交易 Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg-void: #121418; --bg-surface: #191c22; --bg-raised: #222630; --border: #2b303a;
    --text-primary: #e6e8ec; --text-muted: #969ba7; --accent: #8296c4;
    --spend: #c46a58; --income: #6a9c82; --warn: #b39a68; --net: #8a93a6;
    --up: #c46a58; --down: #6a9c82;
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
    --r-card:10px; --r-ctl:8px; --r-pill:14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg-void); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums slashed-zero; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 var(--sp4) var(--sp6); }
  .proto { max-width: 980px; margin: var(--sp3) auto 0; padding: var(--sp2) var(--sp3); color: var(--text-muted); font-size: 12px; }
  .proto b { color: var(--text-primary); font-weight: 600; }

  .head { position: sticky; top: 0; z-index: 5; background: var(--bg-void); border-bottom: 1px solid var(--border);
    margin: 0 calc(-1 * var(--sp4)) var(--sp4); padding: var(--sp4) var(--sp4) 0; }
  .head-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); margin-bottom: var(--sp2); }
  .title-row { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .head-actions { display: flex; align-items: center; gap: var(--sp2); flex-shrink: 0; }
  .sheet-link { color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 44px; height: 44px; margin: 0 -10px 0 -6px; line-height: 0; text-decoration: none; border-radius: var(--r-ctl); }
  .sheet-link:hover { color: var(--accent); }
  .sheet-link:focus-visible { outline: 2px solid var(--accent); outline-offset: -6px; }
  /* Tabs: a segmented control, three equal 44px targets. */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); }
  .tabs button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: none; border-radius: var(--r-ctl); background: none; cursor: pointer; padding: 0 var(--sp2); font: inherit; }
  .tabs button .tt { font-size: 14px; font-weight: 600; color: var(--text-muted); }
  .tabs button .tsub { font-size: 11px; color: var(--text-muted); }
  .tabs button.active { background: var(--bg-raised); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .tabs button.active .tt { color: var(--text-primary); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .head-search { margin-bottom: var(--sp2); }
  .head-search .search { width: 100%; height: 44px; font-size: 16px; padding: 0 var(--sp3); }
  .controls { display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; margin: var(--sp3) 0 var(--sp3); }
  /* Segmented control (period, inbox range, trend mode) and the ‹ label › stepper. */
  .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-ctl); }
  .seg button { min-height: 44px; min-width: 52px; padding: 0 var(--sp3); border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .controls .seg button { min-height: 44px; }
  .seg button[aria-pressed="true"] { background: var(--bg-raised); color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .stepper { display: inline-flex; align-items: center; margin-left: auto; }
  .stepper button { width: 44px; height: 44px; border: 0; border-radius: var(--r-ctl); background: none; color: var(--text-primary); font-size: 22px; line-height: 1; cursor: pointer; }
  .stepper button:hover:not([disabled]) { background: var(--bg-raised); }
  .stepper button[disabled] { color: var(--text-muted); opacity: .35; cursor: default; }
  .stepper button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .step-label { font-size: 14px; font-weight: 600; min-width: 92px; text-align: center; white-space: nowrap; }
  .controls > .step-label { margin-left: auto; color: var(--text-muted); font-weight: 500; }
  .hint { font-size: 11px; color: var(--text-muted); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-bottom: var(--sp3); background: var(--border);
    border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  .kpis.k3 { grid-template-columns: repeat(3, 1fr); margin-bottom: var(--sp4); }
  .kpi { background: var(--bg-surface); padding: var(--sp3) var(--sp4); }
  .kpi .k-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: var(--sp1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .k-value { font-size: 22px; font-weight: 600; letter-spacing: -.01em; color: var(--text-primary); }
  .kpi .k-value.pos { color: var(--income); } .kpi .k-value.neg { color: var(--spend); } .kpi .k-value.spend { color: var(--spend); } .kpi .k-value.income { color: var(--income); }
  .kpi .k-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .k-sub2 { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .delta { font-weight: 600; } .delta.up { color: var(--up); } .delta.down { color: var(--down); }
  .meter { height: 3px; border-radius: 2px; background: var(--bg-raised); margin-top: 6px; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 2px; }
  @media (max-width: 640px) { .kpis, .kpis.k3 { grid-template-columns: repeat(2, 1fr); } }


  /* 總覽: one column on a phone; two at a container of 700px or more (left hero + daily
     categories, right projects + calendar). .wrap pads 16px a side, so that is a 732px viewport. */
  .ovgrid { display: grid; grid-template-columns: 1fr; gap: var(--sp3); }
  .ovcol { display: flex; flex-direction: column; gap: var(--sp3); min-width: 0; }
  @media (min-width: 732px) { .ovgrid { grid-template-columns: 1fr 1fr; align-items: start; } }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); flex-wrap: wrap; }
  .eyebrow { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--bg-raised); color: var(--text-muted); }
  .chip.ok { color: var(--text-primary); }
  .chip.good { color: var(--income); background: rgba(106,156,130,.14); }
  .chip.warn { color: var(--warn); background: rgba(179,154,104,.16); }
  .chip.bad { color: var(--spend); background: rgba(196,106,88,.16); }
  .hero-num { font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 6px 0 10px; }
  /* Meter: full width = 140% of the baseline; the marker is 100%, at 1/1.4 of the width. */
  .hmeter { position: relative; height: 8px; border-radius: 4px; background: var(--bg-raised); overflow: hidden; }
  .hmeter i { position: absolute; top: 0; bottom: 0; display: block; }
  .hmeter .hm-fill { left: 0; background: var(--accent); }
  .hmeter .hm-over { background: var(--spend); }
  .hmeter .hm-mark { left: 71.43%; width: 2px; margin-left: -1px; background: var(--text-primary); }
  .hero-legend { display: flex; justify-content: space-between; gap: var(--sp2); font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .hero-sub { font-size: 12px; color: var(--text-muted); margin-top: var(--sp2); }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp2); margin-top: var(--sp3); padding-top: var(--sp3); border-top: 1px solid var(--border); }
  .hero-stats div { min-width: 0; }
  .hero-stats span { display: block; font-size: 11px; color: var(--text-muted); }
  .hero-stats b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-stats b.inc { color: var(--income); } .hero-stats b.spend { color: var(--spend); }
  @media (max-width: 420px) { .hero-stats { gap: 6px; } .hero-stats b { font-size: 13px; } }
  .incsrc-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px; margin-top: var(--sp2); padding: 0; border: 0; border-top: 1px solid var(--border); background: none; color: var(--text-muted); font: inherit; font-size: 13px; cursor: pointer; }
  .incsrc-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .incsrc-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 專案 card */
  .pj-stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg-raised); }
  .pj-stack i { display: block; height: 100%; }
  .pj-sum { display: flex; justify-content: space-between; gap: var(--sp2); font-size: 12px; color: var(--text-muted); margin: var(--sp2) 0 var(--sp1); }
  .pj-sum b { color: var(--text-primary); font-weight: 600; }
  .pj-row { border-top: 1px solid var(--border); }
  .pj-toggle { display: flex; align-items: center; gap: var(--sp2); width: 100%; min-height: 56px; padding: 6px 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .pj-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .pj-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pj-name b { font-weight: 600; }
  .pj-run { font-size: 12px; color: var(--text-muted); }
  .pj-amt { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
  .pj-amt b { font-weight: 600; font-size: 15px; }
  .pj-amt span { font-size: 12px; color: var(--text-muted); }
  .pj-row.open .chev { transform: rotate(90deg); }
  .pj-row .drill { display: block; margin-top: 0; }
  .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: var(--sp3); margin-bottom: var(--sp4); }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp4); }
  .panel h3 { font-size: 14px; color: var(--text-primary); font-weight: 650; margin-bottom: var(--sp3); display: flex; justify-content: space-between; align-items: center; gap: var(--sp2); flex-wrap: wrap; }
  .panel h3.inc { color: var(--income); }
  .h3note { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  /* Category icons. A tile is a rounded square holding the category's line icon: tinted (icon in the
     category colour on that colour + '2e', set inline by catTile) or neutral (the class below). */
  .ctile { display: inline-grid; place-items: center; flex-shrink: 0; width: 28px; height: 28px; border-radius: 7px; line-height: 0; }
  .ctile svg { width: 62%; height: 62%; display: block; }
  .ctile svg .f, .catchip svg .f { fill: currentColor; stroke: none; }
  .ctile.neutral { color: var(--text-muted); background: var(--bg-raised); }
  .ctile.s22 { width: 22px; height: 22px; border-radius: 6px; }
  .ctile.s28 { width: 28px; height: 28px; border-radius: 7px; }
  .ctile.s30 { width: 30px; height: 30px; border-radius: 8px; }
  .ctile.s34 { width: 34px; height: 34px; border-radius: 9px; }
  .catchip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font: inherit; font-size: 12px; line-height: 1.2; cursor: pointer; max-width: 100%; }
  .catchip:hover:not([disabled]), .catchip:focus-visible { outline: none; border-color: var(--accent); }
  .catchip[disabled] { opacity: .5; cursor: default; }
  .catchip .catchip-ic { color: var(--text-muted); line-height: 0; flex-shrink: 0; }
  .catchip .catchip-ic svg { width: 16px; height: 16px; display: block; }
  .catchip .catchip-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .catchip .catchip-caret { color: var(--text-muted); font-size: 10px; }
  .modal .catchip { width: 100%; padding: 8px 9px; font-size: 14px; }
  .modal .catchip .catchip-name { flex: 1; text-align: left; }

  .lrow { display: flex; align-items: center; gap: var(--sp2); font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .lrow:last-child { border-bottom: none; }
  .lrow .ln { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .ls { color: var(--text-muted); font-size: 11px; }
  .lrow .la { font-weight: 600; color: var(--text-primary); } .lrow .la.inc { color: var(--income); }
  .sharebar { height: 3px; border-radius: 2px; background: var(--bg-raised); margin-top: 5px; overflow: hidden; }
  .sharebar > i { display: block; height: 100%; background: var(--income); opacity: .8; }
  .ltot { display: flex; justify-content: space-between; align-items: baseline; margin-top: var(--sp3); padding-top: var(--sp3); border-top: 1px solid var(--border); }
  .ltot .t-l { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
  .ltot .t-v { font-size: 20px; font-weight: 600; }

  /* 趨勢 monthly chart: stacked HTML bars under one SVG of lines (viewBox 0..100, stretched). */
  .tchart { display: flex; gap: 6px; }
  .tc-axis { position: relative; width: 34px; height: 150px; flex-shrink: 0; font-size: 10px; color: var(--text-muted); }
  .tc-axis span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; }
  .tc-plot { position: relative; flex: 1; min-width: 0; }
  .tc-grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); pointer-events: none; }
  .tc-bars { position: relative; display: flex; gap: 3px; }
  .tc-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .tc-bar { height: 150px; width: 100%; max-width: 26px; display: flex; flex-direction: column; justify-content: flex-end; border-bottom: 1px solid var(--border); }
  .tc-bar i { display: block; width: 100%; }
  .tc-bar i:first-child { border-radius: 3px 3px 0 0; }
  .tc-col.partial .tc-bar i { opacity: .5; }
  .tc-lbl { font-size: 10px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; }
  .tc-lines { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 150px; overflow: visible; z-index: 2; pointer-events: none; }
  .tc-lines line, .tc-lines polyline { fill: none; vector-effect: non-scaling-stroke; }
  .tl-base { stroke: var(--text-primary); stroke-width: 1.2; stroke-dasharray: 5 4; opacity: .8; }
  .tl-avg { stroke: var(--warn); stroke-width: 2; }
  .tl-inc { stroke: var(--income); stroke-width: 2; }
  .tlegend i.lk-base { width: 14px; height: 0; border-top: 1.5px dashed var(--text-primary); border-radius: 0; }
  .tlegend i.lk-avg { width: 14px; height: 2px; background: var(--warn); }
  .tlegend i.lk-inc { width: 14px; height: 2px; background: var(--income); }
  .mtable-wrap { overflow-x: auto; }
  .mtable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .mtable th, .mtable td { padding: 7px 4px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .mtable th { font-weight: 600; color: var(--text-muted); font-size: 12px; }
  .mtable th:first-child, .mtable td:first-child { text-align: left; padding-left: 0; }
  .mtable td:last-child { font-weight: 600; }
  .mtable tr:last-child td { border-bottom: none; }
  .tlegend { display: flex; gap: var(--sp4); font-size: 11px; color: var(--text-muted); margin-top: var(--sp3); flex-wrap: wrap; }
  .tlegend span { display: inline-flex; align-items: center; gap: 5px; }
  .tlegend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }


  .toolbar { display: flex; gap: var(--sp2); align-items: center; margin: var(--sp2) 0 var(--sp3); }
  .toolbar h2 { font-size: 14px; font-weight: 600; margin-right: auto; }
  .toolbar h2 .th { font-weight: 400; color: var(--text-muted); font-size: 12px; }
  .search { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--r-ctl);
    padding: 5px 10px; font-size: 12px; width: 132px; height: 28px; }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--text-muted); }

  .row-card { border-top: 1px solid var(--border); padding: var(--sp3) 0; cursor: pointer; }
  .row-card:first-of-type { border-top: 0; padding-top: 0; }
  .row-card:hover .rc-name { color: var(--accent); }
  .rc-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp3); }
  .rc-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: var(--sp2); min-width: 0; }
  .rc-name .dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .rc-end { display: flex; align-items: center; gap: var(--sp2); white-space: nowrap; }
  .chev { color: var(--text-muted); font-size: 11px; transition: transform .15s; }
  .row-card.open .chev { transform: rotate(90deg); }
  .rc-total { font-weight: 600; font-size: 15px; color: var(--text-primary); white-space: nowrap; }
  .rc-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .rc-bar { position: relative; height: 8px; border-radius: 4px; background: var(--bg-raised); margin: 8px 0 5px; }
  .rc-bar > i { display: block; height: 100%; border-radius: 4px; }
  /* The category's normal month: a thin white line across the bar. */
  .rc-bar > i.rc-mark { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text-primary); }
  .delta.new { color: var(--accent); }
  .rc-bar + .rc-meta { margin-top: 0; }
  .drill { margin-top: var(--sp3); border-top: 1px solid var(--border); padding-top: var(--sp2); display: none; }
  .row-card.open .drill { display: block; }
  .txn-toggle { display: block; width: 100%; min-height: 44px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .txn-toggle .txn { min-height: 44px; }
  .txn-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .txn-toggle .txn::before { content: '▶'; color: var(--text-muted); font-size: 10px; }
  .txn-toggle[aria-expanded="true"] .txn::before { content: '▼'; }
  .category-txn .erow.done { opacity: 1; }
  .txn { display: flex; align-items: center; gap: var(--sp2); font-size: 12px; padding: 5px 0; }
  .txn .m { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn .a { color: var(--text-primary); font-weight: 600; } .txn .d { color: var(--text-muted); }
  .txn .cat { color: var(--text-muted); background: var(--bg-raised); border-radius: 4px; padding: 0 6px; font-size: 11px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 4px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); }

  /* per-card panel */
  .cardrow { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .cardrow:last-child { border-bottom: none; }
  .cardrow .ctop { display: flex; align-items: baseline; gap: var(--sp2); }
  .cardrow .cname { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: var(--sp2); min-width: 0; }
  .cardrow .cdot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .cardrow .camt { margin-left: auto; font-weight: 600; white-space: nowrap; }
  .cardrow .cpct { color: var(--text-muted); font-size: 12px; min-width: 38px; text-align: right; }
  .cardrow .cmeta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .delta.flat { color: var(--text-muted); }

  /* spend calendar heatmap */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .dow { font-size: 11px; color: var(--text-muted); text-align: center; padding-bottom: 2px; }
  /* Square cells were fine when the heatmap owned its own tab. Sharing a page with the KPIs and
     the per-category detail, a 7×140px grid became a wall the reader had to scroll past, so the
     cells are capped: wide enough to stay readable, short enough that a whole month plus the day
     editor fits above the fold. */
  .cell { aspect-ratio: 1.7; max-height: 62px; border-radius: 5px; background: var(--bg-raised); border: 1px solid transparent;
    display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px 4px; position: relative; }
  /* On a phone the cells are square and at least 44px: 390px − 2×16 page − 2×12 panel − 6×4 gap = 310 = 7 × 44. */
  @media (max-width: 520px) { .cal { gap: 4px; } .cell { aspect-ratio: 1; max-height: none; min-height: 44px; } .ovcol .panel { padding: var(--sp3); } }
  .cell .dn { font-size: 10px; color: var(--text-muted); opacity: .7; }
  .cell[data-hday] { cursor: pointer; }

    border-radius: 50%; background: var(--text-muted); pointer-events: none; }

  .hdetail { margin-top: var(--sp3); border-top: 1px solid var(--border); padding-top: var(--sp3); }

  /* editable day list */

  .ev-head .lbl { font-size: 12px; color: var(--text-muted); flex: 1; min-width: 0; }
  .dayadd { min-height: 44px; padding: 0 var(--sp3); border: 1px solid var(--accent); border-radius: var(--r-ctl); background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .dayadd:hover { background: var(--accent); color: #0e1220; }
  .ev-toggle { margin-left: auto; min-height: 44px; font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--border); border-radius: var(--r-pill); padding: 3px 14px; cursor: pointer; }
  .ev-toggle:hover { background: var(--bg-raised); }
  .erow { padding: 9px 0; border-bottom: 1px solid var(--border); transition: opacity .15s; }

  .hdetail .erow.done { opacity: 1; }
  /* A row whose delete is in flight stays on screen until deleteTxn settles: dimmed further than
     a recorded row, struck through, inert, with 刪除中… where its 🗑 was. The context-qualified
     selectors match .hdetail/.category-txn .erow.done, so a recorded row being deleted dims too. */
  .erow.deleting, .hdetail .erow.deleting, .category-txn .erow.deleting, .txn-toggle.deleting { opacity: .4; }
  .erow.deleting .merin, .erow.deleting .amt, .txn-toggle.deleting .m { text-decoration: line-through; }
  .erow.deleting input, .erow.deleting select, .erow.deleting button { cursor: default; }
  .txdeleting { font-size: 12px; color: var(--spend); white-space: nowrap; flex-shrink: 0; }
  .er1 { display: flex; align-items: baseline; gap: var(--sp2); }
  .er1 .mer { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .er1 .merin { flex: 1; min-width: 0; font: inherit; font-weight: 600; color: inherit; background: none; border: 1px solid transparent; border-radius: 5px; padding: 2px 5px; margin: -2px 0 -2px -5px; }
  .er1 .merin:hover { border-color: var(--border); }
  .er1 .merin:focus { outline: none; border-color: var(--accent); background: var(--bg-raised); }
  .er1 .merin::placeholder { color: var(--text-muted); font-weight: 400; }
  .er1 .ehm { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .er1 .amt { font-weight: 600; white-space: nowrap; }
  .er1 .mail { color: var(--text-muted); display: inline-flex; align-items: center; align-self: center;
    flex-shrink: 0; line-height: 0; text-decoration: none; }
  .er1 .mail:hover { color: var(--accent); }
  .er1 .mail:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .er2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .er2 .fld { display: flex; align-items: center; gap: 4px; }
  .er2 .fld .lb { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .er2 select { min-height: 44px; background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12px; cursor: pointer; }
  .er2 .catchip, .er2 .amtcor, .er1 .merin, .er1 .amtbtn { min-height: 44px; }
  .er1 .amtbtn { min-width: 44px; text-align: right; }
  .er1 { align-items: center; }
  .er1 .mail { width: 44px; height: 44px; justify-content: center; margin: 0 -10px; }
  .er2 select:focus { outline: none; border-color: var(--accent); }
  .er2 .amtcor { background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 7px; font: inherit; font-size: 12px; width: 132px; }
  .er2 .amtcor { width: 96px; text-align: right; }
  .er2 .amtcor:focus { outline: none; border-color: var(--accent); }
  .erec { margin-left: auto; min-height: 44px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-muted); border-radius: 7px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* 我的消費 split. An unsplit row must look exactly as it did before this feature existed,
     so .amtbtn is a button that renders as plain text — the only tell is a hover underline. */
  .amtbtn { font: inherit; font-weight: 600; background: none; border: none; padding: 0;
    cursor: pointer; white-space: nowrap; border-bottom: 1px dashed transparent; }
  .amtbtn:hover { border-bottom-color: var(--text-muted); }
  .amtbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .orig { font-size: 11px; font-weight: 400; color: var(--warn); margin-left: 6px; }
  .adv { color: var(--warn); }
  .split { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp2); margin-top: 7px;
    padding: var(--sp3); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-ctl); }
  .split .slb { font-size: 12px; }
  .split .sin { width: 108px; font: inherit; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums;
    background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; }
  .split .sin:focus { outline: none; border-color: var(--accent); }
  .split .shint { font-size: 12px; color: var(--text-muted); }
  .split .sbtn { min-height: 44px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-muted);
    border-radius: 7px; padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .split .sin { min-height: 44px; }
  .split .sbtn.ok { margin-left: auto; border-color: var(--accent); color: var(--accent); }
  .split .sbtn:hover { color: var(--text-primary); }
  .split .sbtn.ok:hover { background: var(--accent); color: #17191f; }
  .split .snote { flex-basis: 100%; font-size: 11px; color: var(--warn); }
  .erec:hover { border-color: var(--income); color: var(--income); }
  .erow.done .erec { border-color: var(--income); color: var(--income); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 18px; border-radius: var(--r-pill); font-size: 13px; opacity: 0; transition: all .2s; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.4); z-index: 20; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--spend); color: var(--spend); }

  /* header actions + modal */
  .addbtn { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; background: var(--accent); color: #0e1220; border: none; border-radius: var(--r-ctl); padding: 0 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .addbtn:hover { filter: brightness(1.08); }
  .settingsbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-primary); border-radius: var(--r-ctl); padding: 0; cursor: pointer; }
  .settingsbtn:hover { border-color: var(--accent); color: var(--accent); }
  .txdel, .erdel { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; width: 44px; height: 44px; cursor: pointer; flex-shrink: 0; font-size: 14px; }
  .txdel:hover, .erdel:hover { border-color: var(--spend); color: var(--spend); }
  .overlay { position: fixed; inset: 0; background: rgba(8,10,14,.6); display: none; align-items: flex-start; justify-content: center; padding: 6vh var(--sp4); z-index: 30; }
  .overlay.on { display: flex; }
  .modal { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); width: 100%; max-width: 460px; padding: var(--sp4); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: var(--sp1); }
  .modal .msub { font-size: 12px; color: var(--text-muted); margin-bottom: var(--sp4); }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
  .mfld { display: flex; flex-direction: column; gap: 4px; } .mfld.full { grid-column: 1/-1; }
  .mfld label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .mfld label .req { color: var(--spend); }
  .modal input, .modal select { background: var(--bg-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; font-size: 14px; font-family: inherit; }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
  .modal input.bad { border-color: var(--spend); }
  .source-row { display: flex; gap: var(--sp2); }
  .source-row select { flex: 1; min-width: 0; }
  .source-add { border: 1px solid var(--border); background: var(--bg-raised); color: var(--accent); border-radius: 6px; padding: 8px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .source-add:hover { border-color: var(--accent); }
  .source-new { display: flex; gap: var(--sp2); margin-top: 3px; }
  .source-new[hidden] { display: none; }
  .source-new input { flex: 1; min-width: 0; }
  .source-new button { border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-primary); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
  .source-new button.primary { border-color: var(--accent); color: var(--accent); }
  .source-new button[disabled] { opacity: .5; cursor: default; }
  .account-list { list-style: none; border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; margin-bottom: var(--sp3); }
  .account-list li { padding: 8px 10px; background: var(--bg-raised); border-bottom: 1px solid var(--border); }
  .account-list li:last-child { border-bottom: none; }
  .account-list .account-empty { color: var(--text-muted); }
  .minfo { grid-column: 1/-1; font-size: 12px; color: var(--text-muted); background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 8px 10px; }
  .minfo b { color: var(--text-primary); }
  .macts { display: flex; gap: var(--sp2); justify-content: flex-end; margin-top: var(--sp4); }
  .mbtn { border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-primary); border-radius: 7px; padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .mbtn.primary { background: var(--accent); border-color: var(--accent); color: #0e1220; }
  .mbtn.danger { background: var(--spend); border-color: var(--spend); color: #fff; }

  /* Settings sheet. .overlay / .modal / .macts / .source-new are shared with the add and delete
     dialogs, so every rule here is scoped to #settingsOverlay or the .settings-sheet class on its
     dialog. Desktop: the centred 460px dialog. Phone (<= 640px): a bottom sheet (block below). */
  #settingsOverlay .settings-sheet { display: flex; flex-direction: column; padding: 0; max-height: 88vh; overflow: hidden; animation: settings-fade .16s ease-out; }
  @keyframes settings-fade { from { transform: translateY(8px); opacity: 0; } }
  @keyframes settings-up { from { transform: translateY(40px); opacity: .4; } }
  .settings-sheet .settings-grab { display: none; width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; flex-shrink: 0; }
  .settings-sheet .settings-head { display: flex; align-items: center; gap: var(--sp2); padding: var(--sp3) var(--sp3) var(--sp2) var(--sp4); flex-shrink: 0; }
  .settings-sheet .settings-head h3 { margin: 0; flex: 1; min-width: 0; }
  .settings-sheet .settings-status { display: inline-flex; align-items: center; gap: 5px; min-height: 18px; font-size: 12px; color: var(--text-muted); transition: opacity .4s; }
  .settings-sheet .settings-status.fade { opacity: 0; }
  .settings-sheet .settings-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--income); }
  .settings-sheet .settings-status.saving .settings-dot { background: var(--accent); animation: settings-pulse .8s infinite alternate; }
  .settings-sheet .settings-status.err { color: var(--spend); }
  .settings-sheet .settings-status.err .settings-dot { background: var(--spend); }
  @keyframes settings-pulse { to { opacity: .3; } }
  .settings-sheet .settings-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg-raised); color: var(--text-muted); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .settings-sheet .settings-x:hover { color: var(--text-primary); }
  .settings-sheet .settings-tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin: 0 var(--sp4) var(--sp3); padding: 3px; background: var(--bg-raised); border-radius: var(--r-ctl); flex-shrink: 0; }
  .settings-sheet .settings-tab-pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--bg-surface); border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.45); transition: transform .22s cubic-bezier(.3,.7,.3,1); }
  .settings-sheet .settings-tabs[data-active="categories"] .settings-tab-pill { transform: translateX(100%); }
  .settings-sheet .settings-tabs button { position: relative; z-index: 1; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-muted); min-height: 44px; padding: 7px 0; border-radius: 6px; cursor: pointer; }
  .settings-sheet .settings-tabs button[aria-selected="true"] { color: var(--text-primary); }
  .settings-sheet .settings-tab-n { margin-left: 4px; font-weight: 500; color: var(--text-muted); }
  .settings-sheet .settings-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--sp4) var(--sp4); }
  .settings-sheet .settings-hint { font-size: 12px; color: var(--text-muted); margin-bottom: var(--sp2); }
  .settings-sheet .settings-group { border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-raised); }
  .settings-sheet .settings-list { list-style: none; }
  .settings-sheet .settings-row { position: relative; display: flex; align-items: center; gap: var(--sp2); min-height: 48px; padding: 0 var(--sp2) 0 0; background: var(--bg-raised); border-bottom: 1px solid var(--border); }
  .settings-sheet .settings-row:first-child { border-radius: var(--r-ctl) var(--r-ctl) 0 0; }
  .settings-sheet .settings-name { flex: 1; min-width: 0; padding-left: var(--sp2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .settings-sheet .settings-acct-list .settings-name { padding-left: var(--sp3); }
  .settings-sheet .settings-empty { color: var(--text-muted); padding-left: var(--sp4); }
  .settings-sheet .settings-handle { width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: grab; touch-action: none; }
  .settings-sheet .settings-handle svg { width: 14px; height: 14px; fill: currentColor; }
  .settings-sheet .settings-handle:hover { color: var(--text-primary); }
  .settings-sheet .settings-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .settings-sheet .settings-handle[disabled] { opacity: .35; cursor: default; }
  .settings-sheet .settings-cat-list.dragging { user-select: none; -webkit-user-select: none; }
  .settings-sheet .settings-cat-list.dragging .settings-row { transition: transform .18s cubic-bezier(.3,.7,.3,1); }
  .settings-sheet .settings-cat-list.dragging .settings-row.dragging { z-index: 3; transition: none; border-radius: var(--r-ctl); box-shadow: 0 10px 28px rgba(0,0,0,.45); outline: 1px solid var(--accent); outline-offset: -1px; }
  .settings-sheet .settings-row.dragging .settings-handle { color: var(--accent); cursor: grabbing; }
  .settings-sheet .settings-add-toggle { display: flex; align-items: center; gap: var(--sp2); width: 100%; min-height: 46px; padding: 0 var(--sp3); border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 14px; text-align: left; cursor: pointer; border-radius: 0 0 var(--r-ctl) var(--r-ctl); }
  .settings-sheet .settings-add-toggle[hidden], .settings-sheet .settings-add-form[hidden] { display: none; }
  .settings-sheet .settings-add-form { display: flex; align-items: center; gap: var(--sp2); padding: 6px var(--sp2) 6px var(--sp3); }
  .settings-sheet .settings-add-form input { flex: 1; min-width: 0; background: var(--bg-surface); border-color: var(--accent); padding: 7px 9px; }
  .settings-sheet .settings-add-form input.bad { border-color: var(--spend); }
  .settings-sheet .settings-add-form button { min-height: 44px; border: 0; border-radius: 6px; padding: 7px 12px; background: var(--accent); color: #0e1220; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .settings-sheet .settings-add-form button[disabled] { opacity: .5; cursor: default; }
  .settings-sheet .settings-add-form .settings-add-cancel { background: transparent; color: var(--text-muted); padding: 7px 6px; }
  .settings-sheet .settings-foot { font-size: 12px; color: var(--text-muted); margin: var(--sp2) 2px 0; }
  .settings-sheet .settings-kind { display: inline-flex; flex-shrink: 0; padding: 2px; gap: 2px; background: var(--bg-surface); border-radius: 7px; }
  .settings-sheet .settings-kind button { min-width: 44px; min-height: 44px; padding: 0 6px; border: 0; border-radius: 5px; background: transparent; color: var(--text-muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .settings-sheet .settings-kind button[aria-pressed="true"] { background: var(--bg-raised); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .settings-sheet .settings-kind button[data-kind="project"][aria-pressed="true"] { color: var(--accent); }
  .settings-sheet .settings-kind button[disabled] { opacity: .45; cursor: default; }
  .settings-sheet .settings-start { flex-shrink: 0; width: 104px; min-height: 44px; padding: 4px 6px; font-size: 12px; }
  .settings-sheet .settings-baseline-h { margin-top: var(--sp4); }
  .settings-sheet .settings-baseline { padding: var(--sp2); }
  .settings-sheet .settings-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--bg-surface); border-radius: 7px; }
  .settings-sheet .settings-seg button { min-height: 44px; border: 0; border-radius: 5px; background: transparent; color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .settings-sheet .settings-seg button[aria-pressed="true"] { background: var(--bg-raised); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .settings-sheet .settings-budget-row { display: flex; align-items: center; gap: var(--sp2); margin-top: var(--sp2); font-size: 13px; }
  .settings-sheet .settings-budget-row[hidden] { display: none; }
  .settings-sheet .settings-budget-row input { flex: 1; min-width: 0; min-height: 44px; text-align: right; }
  .settings-sheet .settings-budget-row input.bad { border-color: var(--spend); }
  .settings-sheet .settings-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 640px) {
    #settingsOverlay { align-items: flex-end; padding: 0; overflow: hidden; }
    #settingsOverlay .settings-sheet { margin: 0; max-width: none; max-height: 86vh; border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.45); animation: settings-up .22s ease-out; }
    .settings-sheet .settings-grab { display: block; }
    .settings-sheet .settings-body { padding-bottom: calc(var(--sp4) + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .settings-sheet, .settings-sheet * { animation: none !important; transition: none !important; }
  }

  /* Category picker. Opened from the 類別 chip of an edit row or of the add dialog, so it stacks
     above #addOverlay. Desktop: a centred dialog. Phone (<= 640px): a bottom sheet, the same
     pattern as the Settings sheet. */
  #catPickOverlay { z-index: 40; }
  #catPickOverlay .catpick { display: flex; flex-direction: column; padding: 0; max-height: 88vh; overflow: hidden; animation: settings-fade .16s ease-out; }
  .catpick .catpick-grab { display: none; width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; flex-shrink: 0; }
  .catpick .catpick-head { padding: var(--sp4) var(--sp4) var(--sp3); flex-shrink: 0; }
  .catpick .catpick-head h3 { margin: 0; }
  .catpick .catpick-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .catpick .catpick-sub[hidden] { display: none; }
  .catpick .catpick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp2); padding: 0 var(--sp4) var(--sp4); overflow-y: auto; overscroll-behavior: contain; }

  .empty { text-align: center; padding: var(--sp6) var(--sp4); color: var(--text-muted); }
  /* 待記帳 inbox: one flat cross-day queue. Day sections reuse .erow from the per-day editor. */
  .tabs button .tsub .cnt { display: inline-block; min-width: 16px; padding: 0 5px; margin-right: 4px; border-radius: var(--r-pill);
    background: var(--spend); color: #17191f; font-weight: 700; font-size: 10px; text-align: center; }

  .dbulk[disabled] { opacity: .4; cursor: default; }
  .footer { text-align: center; padding: var(--sp4); font-size: 12px; color: var(--text-muted); }
  .loading, .error { text-align: center; padding: var(--sp6) var(--sp4); color: var(--text-muted); }

<body>
<div class="wrap"><div id="app"><div class="loading">載入中…</div></div></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3>新增交易</h3>

    <div class="mgrid">
      <div class="mfld"><label>日期 <span class="req">*</span></label><input type="date" id="a-date"></div>
      <!-- 時間留白 = 這筆真的不知道幾點,不是預設中午。留白會存成「只有日期」的儲存格,
           跟 2026/06 以前的舊資料一樣,在當天排最前面也不顯示時間。 -->
      <div class="mfld"><label>時間（選填）</label><input type="time" id="a-time"></div>
      <div class="mfld"><label>金額 <span class="req">*</span></label><input type="number" id="a-amt" placeholder="0" min="0" inputmode="numeric"></div>
      <div class="mfld"><label>收支別 <span class="req">*</span></label><select id="a-type"><option>支出</option><option>收入</option><option>轉帳</option></select></div>
      <!-- full: after the time field the grid is odd-width; 來源 spans so it
           does not leave a hole in front of 商店/說明. Options come from
           distinctBanks() into a closed <select> — the previous datalist was
           pre-filled and never showed the other accounts on tap. -->
      <div class="mfld full"><label>來源</label>
        <div class="source-row"><select id="a-source"></select></div>
      </div>
      <div class="mfld full"><label>商店 / 說明</label><input type="text" id="a-mer" placeholder="例：路邊攤晚餐"></div>

    </div>
    <div class="macts"><button class="mbtn" id="a-cancel">取消</button><button class="mbtn primary" id="a-save">新增</button></div>

</div>

        </div>
      </div>
      <div role="tabpanel" id="settings-panel-categories" aria-labelledby="settings-tab-categories" hidden>

        </div>
        <p class="settings-foot">「未分類」固定在選單最上面，不在這裡排序。專案類別不計入日常支出，另有自己的累計。</p>
        <div class="settings-sr" id="settings-category-live" aria-live="assertive"></div>
        <p class="settings-hint settings-baseline-h" id="settings-baseline-label">日常的比較對象</p>

          <div class="settings-seg" role="group" aria-labelledby="settings-baseline-label">
            <button type="button" id="settings-baseline-median" data-baseline="median" aria-pressed="true">過去 12 個月中位數</button>
            <button type="button" id="settings-baseline-budget" data-baseline="budget" aria-pressed="false">自訂預算</button>
          </div>
          <div class="settings-budget-row" id="settings-budget-row" hidden><label for="settings-budget">每月預算</label><input id="settings-budget" type="number" inputmode="numeric" min="1" step="1" placeholder="例如 60000"><span>元</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="catPickOverlay">

</div>

    <div class="minfo"><b id="d-mer"></b><div class="dmeta"><span id="d-date"></span> · <span id="d-amt" class="num"></span></div></div>
    <div class="macts"><button type="button" class="mbtn" id="d-cancel">取消</button><button type="button" class="mbtn danger" id="d-ok">刪除</button></div>
  </div>
</div>
<script>
  // Card colours for 信用卡別 (cardPanel) only: muted, cool-leaning, and deliberately AVOIDS

    bag: '<path d="M5 8h14l-1 13H6zM9 8V6.5a3 3 0 0 1 6 0V8"/>',

    medical: '<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/>',

    car: '<path d="M3.5 16.5v-4l2-5.5h13l2 5.5v4zM3.5 12.5h17M7 16.5v2.5M17 16.5v2.5"/><circle class="f" cx="7.5" cy="14.5" r=".9"/><circle class="f" cx="16.5" cy="14.5" r=".9"/>',
    moto: '<circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16 9.5 10h5l4 6M14.5 10l-1.5-3.5h-2.5M14.5 10H19"/>',
    house: '<path d="M3 11.5 12 4l9 7.5M5.5 10v10.5h13V10M10 20.5v-6h4v6"/>',
    rings: '<circle cx="9" cy="14.5" r="5"/><circle cx="15" cy="14.5" r="5"/><path d="m10 5.5 2-2.5 2 2.5-2 2z"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8c-1.5-3.5-5.5-3.5-5.5-1.3S10 8 12 8s5.5 .9 5.5-1.3S13.5 4.5 12 8"/>',
    q: '<circle cx="12" cy="12" r="8.5" stroke-dasharray="3 2.6"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.6h.01"/>',
  };
  var CATEGORY_ICON = { 飲食:'utensils', 交通:'train', 超市:'basket', 個人:'user', 娛樂:'game', 購物:'bag', 家居:'bulb', 醫療:'medical',
    旅遊:'plane', 投資:'trend', 其他:'dots', 汽車:'car', 重機:'moto', 房屋:'house', 結婚:'rings', 禮金:'gift', 未分類:'q' };
  var NOW = { year: +('<?= now.year ?>'), month: +('<?= now.month ?>'), day: +('<?= now.day ?>') };
  var SHEET_URL = '<?= sheetUrl ?>';
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }

  var TXNS = [];
  var ACCOUNT_SOURCES = [];
  var PREFERRED_SOURCE = null;
  var ACCOUNT_CREATE_PENDING = false;
  // META!D in the owner's order, as last confirmed by the server (getDashboardData / addCategory /
  // setCategoryOrder). The pickers read it through distinctCats().
  var CATEGORY_LIST = [];
  var CATEGORY_SAVE_PENDING = false;
  // Settings › 類別. CATEGORY_SHOWN is the order on screen while it runs ahead of the server (a drag
  // being saved, or keyboard moves inside their debounce); null means CATEGORY_LIST. The pickers
  // never read it, so they only ever show a server-confirmed order.
  var CATEGORY_SHOWN = null;
  var CATEGORY_KEY_TIMER = null;    // the armed 600ms keyboard-reorder debounce
  var CATEGORY_DRAG = null;         // the active pointer drag
  var SETTINGS_STATUS_TIMER = null;
  // META H:I as last confirmed by the server (getDashboardData / setCategoryProject):
  // [{ name, start: 'YYYY-MM' }]. A category listed here is a project; every other one is daily.
  var PROJECTS = [];
  // META J: the daily baseline, { mode: 'median' | 'budget', amount } (setDailyBaseline).
  var BASELINE = { mode:'median', amount:null };
  var PROJECT_SAVING = {};          // category -> true while its setCategoryProject is in flight
  var BASELINE_SAVING = false;

  var state = { tab:'analysis', scope:'month', selYear:NOW.year, selMonth:NOW.month, q:'',
                inboxScope:'all', inboxDone:false, trendMode:'all' };
  var openRow=null, openHeatDay=null, openSplit=null, openProject=null, incomeOpen=false;
  var addHeatDate=null;
  var openCategoryTxn=null;

  // ---------- 我的消費 (advanced-money split) ----------
  // t.amount is ALREADY my consumption — the server nets it in getAllTxns, so every
  // aggregation on this page sums the right number without knowing this feature exists.
  // t.charged is the real card amount, t.mine the raw declaration (null ⇒ not split).
  function isSplitTxn(t){ return t && t.mine!=null; }
  function chargedOf(t){ return (t && t.charged!=null) ? t.charged : (t?t.amount:0); }
  // Positive only: the reverse case (someone fronted part of MY share) makes this negative,
  // and a "代墊 −$2,000 未計入" note would be nonsense. Those rows just carry no note.
  function advOf(t){ return isSplitTxn(t) ? Math.max(0, chargedOf(t)-t.amount) : 0; }
  function advIn(list){ return list.reduce(function(s,t){ return s+advOf(t); },0); }
  function splitMark(t){ return isSplitTxn(t) ? '<span class="orig num">刷 '+fmt(chargedOf(t))+'</span>' : ''; }

  function resolveScope(s){ if(/^\d{4}-\d{2}$/.test(s)){ var p=s.split('-'); return {level:'month',year:+p[0],month:+p[1]}; } if(/^\d{4}$/.test(s)) return {level:'year',year:+s}; if(s==='month') return {level:'month',year:NOW.year,month:NOW.month}; if(s==='year') return {level:'year',year:NOW.year}; return {level:'all'}; }
  function isCurMonth(r){ return r.level==='month'&&r.year===NOW.year&&r.month===NOW.month; }
  function isPartialCur(r){ return isCurMonth(r)&&NOW.day<daysInMonth(NOW.year,NOW.month); }
  function inScope(t,r){ if(r.level==='all') return true; if(r.level==='year') return t.y===r.year; return t.y===r.year&&t.m===r.month; }

  // ---------- partial history (#58): never show a number computed from part of the rows ----------
  /** True when TXNS holds every row of month m of year y: always once the history is complete,
   *  otherwise only from the first loaded month (HISTORY.before) on. */
  function historyCovers(y,m){
    return HISTORY.complete||!HISTORY.before||(y*100+m)>=(HISTORY.before.y*100+HISTORY.before.m);
  }
  /** Whether a period's numbers need rows not loaded yet: 全部期間, a year that starts before the
   *  loaded range, a month before it. Both tabs also read the last six months whatever the period
   *  (recurring() for the projection and 定期訂閱, the six-month trend chart), so those count too. */
  function scopeNeedsHistory(r){
    if(HISTORY.complete) return false;
    var six=monthsBack(6)[0];
    if(!historyCovers(six.y,six.m)) return true;
    if(r.level==='all') return true;
    if(r.level==='year') return !historyCovers(r.year,1);
    return !historyCovers(r.year,r.month);
  }
  /** The short text a view shows in place of a number that needs the whole history. */
  function historyWaitText(){ return HISTORY.failed?'完整歷史載入失敗':'載入完整歷史中…'; }
  /** The first loaded month, for notes on views that show loaded rows only. */
  function historyFromText(){ return HISTORY.before?HISTORY.before.y+'/'+HISTORY.before.m:''; }
  /** Retry control for a failed background history read; empty otherwise. */
  function historyRetry(){
    return HISTORY.failed?' <button class="ev-toggle" style="margin-left:6px" data-hretry title="'+esc(HISTORY.failed)+'">重試</button>':'';
  }
  var SEARCH_CAP = 40;
  function numericQuery(q){
    var s=String(q||'').trim().replace(/[$,]/g,'');
    if(!/^\d+(\.\d+)?$/.test(s)) return null;
    return Number(s);
  }
  function txnMatchesQuery(t, q){
    var raw=String(q||'').trim();
    if(!raw) return false;
    var ql=raw.toLowerCase();
    if(String(t.merchant||'').toLowerCase().indexOf(ql)>=0) return true;
    if(String(t.cat||'').toLowerCase().indexOf(ql)>=0) return true;
    var n=numericQuery(raw);
    if(n!=null && (Number(t.amount)===n || Number(t.charged)===n)) return true;
    return false;
  }
  function searchHits(txns, q){
    if(!String(q||'').trim()) return [];
    return txns.filter(function(t){ return txnMatchesQuery(t,q); }).sort(function(a,b){
      if(a.y!==b.y) return b.y-a.y;
      if(a.m!==b.m) return b.m-a.m;
      if(a.d!==b.d) return b.d-a.d;
      var ha=a.hm||'', hb=b.hm||'';
      if(ha!==hb) return ha<hb?1:-1;
      return (b.amount||0)-(a.amount||0);
    });
  }
  function periodLabel(r){ if(r.level==='all') return '全部期間'; if(r.level==='year') return r.year+' 全年'+(r.year===NOW.year?'(1–'+NOW.month+' 月)':''); return r.year+' 年 '+r.month+' 月'+(isPartialCur(r)?'(至今 '+NOW.day+' 日)':''); }
  function isIncome(t){ return t.type==='收入'&&t.cat!=='退款'; }
  function isRefund(t){ return t.type==='收入'&&t.cat==='退款'; }
  function isConsumption(t){ var cat=String(t.cat||'').trim(); return t.type==='支出'||(t.type==='轉帳'&&cat!==''&&cat!=='未分類'); }
  function sumScope(pred,r){ return TXNS.filter(function(t){ return pred(t)&&inScope(t,r); }).reduce(function(s,t){return s+t.amount;},0); }
  function sum(a){ return a.reduce(function(s,t){return s+t.amount;},0); }
  function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}); return s[Math.floor(s.length/2)]; }
  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  /** The bare <svg> for a category. Own-property lookups only, so a category literally named
   *  "constructor" still gets the fallback. Icon markup is static code; names never reach it. */
  function catIcon(name){
    var own=Object.prototype.hasOwnProperty;
    var key=own.call(CATEGORY_ICON,name)?CATEGORY_ICON[name]:'q';

  /** A decorative icon tile, size 22/28/30/34. With a colour (a 6-digit hex from catColor) it is

  // ---------- category colours ----------
  // A fixed name-keyed map: one hue per category, distinct from each other and from the spend /

    家居:'#c27a8c', 醫療:'#6fbfa3', 禮金:'#d6a0b0', 其他:'#8f9a6a', 未分類:'#6b7080', 房屋:'#a98bc0', 汽車:'#c4a66a',

  function kpi(label,valHtml,subHtml,cls){ return '<div class="kpi"><div class="k-label">'+label+'</div><div class="k-value num '+(cls||'')+'">'+valHtml+'</div>'+(subHtml||'')+'</div>'; }

  /** What a tab shows for a period whose numbers need the history still loading (#58). */

  // ---------- daily (日常) vs project (專案) ----------
  // A row is a project row if and only if its category is listed in META H (PROJECTS); every other
  // consumption row is daily. Refunds always offset daily, whatever their category: the Issue's
  // settled rule, even though a large project refund can make daily dip in that month.
  var BASE_FLOOR = '2025-10';   // the Gmail-bot era; the earlier Moze months under-record small spends
  function ymKey(y,m){ return y+'-'+('0'+m).slice(-2); }
  function addMonths(key,n){ var p=key.split('-'), t=(+p[0])*12+(+p[1]-1)+n; return ymKey(Math.floor(t/12),t%12+1); }
  function keyCovered(key){ var p=key.split('-'); return historyCovers(+p[0],+p[1]); }
  function projectStart(name){
    for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].name===name) return PROJECTS[i].start;
    return null;
  }
  function isProjectCat(name){ return projectStart(name)!=null; }
  function isDailyTxn(t){ return isConsumption(t)&&!isProjectCat(t.cat); }
  /** Daily spending in scope r: the daily consumption rows, their gross, the refunds in scope and
   *  the net total (gross − refunds). */
  function dailyOf(r){
    var list=TXNS.filter(function(t){ return isDailyTxn(t)&&inScope(t,r); });
    var gross=sum(list), refunds=sumScope(isRefund,r);
    return { list:list, gross:gross, refunds:refunds, total:gross-refunds };
  }
  /** One project category's consumption rows in scope r. */
  function projectOf(cat,r){
    var list=TXNS.filter(function(t){ return isConsumption(t)&&t.cat===cat&&inScope(t,r); });
    return { list:list, total:sum(list), count:list.length };
  }
  /** Last month key the scope reaches ('9999-12' for 全部期間). */
  function scopeEndKey(r){
    if(r.level==='month') return ymKey(r.year,r.month);
    if(r.level==='year') return ymKey(r.year,12);
    return '9999-12';
  }
  /** A project's running total: its consumption from its start month through the end of scope r.
   *  null while the rows from the start month are not all loaded yet (#58). */
  function projectRunning(cat,r){
    var start=projectStart(cat); if(start==null) return null;
    if(!keyCovered(start)) return null;
    var end=scopeEndKey(r);
    return TXNS.reduce(function(s,t){
      if(!isConsumption(t)||t.cat!==cat) return s;
      var k=ymKey(t.y,t.m); return (k>=start&&k<=end)?s+t.amount:s;
    },0);
  }
  /** Per month 'YYYY-MM': daily (net of refunds), gross daily, refunds, income, and the
   *  consumption per daily category (cats) and per project (proj). One pass over TXNS. */
  function monthTotals(){
    var out={};
    TXNS.forEach(function(t){
      if(!t.y||!t.m) return;
      var k=ymKey(t.y,t.m), o=out[k]||(out[k]={ daily:0, gross:0, refunds:0, income:0, cats:{}, proj:{} });
      if(isConsumption(t)){
        if(isProjectCat(t.cat)) o.proj[t.cat]=(o.proj[t.cat]||0)+t.amount;
        else { o.gross+=t.amount; o.cats[t.cat]=(o.cats[t.cat]||0)+t.amount; }
      } else if(isRefund(t)) o.refunds+=t.amount;
      else if(isIncome(t)) o.income+=t.amount;
    });
    Object.keys(out).forEach(function(k){ out[k].daily=out[k].gross-out[k].refunds; });
    return out;
  }

  function curPartialKey(){
    return NOW.day<daysInMonth(NOW.year,NOW.month) ? NOW.year+'-'+('0'+NOW.month).slice(-2) : null;
  }
  /**
   * The months a selected month is compared against: the 12 complete months before it, counting
   * only months from BASE_FLOOR on, and never the running current month. For 2026-09 that is
   * 2025-10..2026-08, 11 months. Calendar months: a month with no rows counts as a zero.

  function baselineWindow(selKey){
    var cp=curPartialKey(), now=ymKey(NOW.year,NOW.month), keys=[];
    for(var i=1;i<=12;i++){

      keys.unshift(k);
    }
    return keys;
  }
  /**
   * The median of a sorted list; an even count averages the middle pair. A median, not a mean:
   * a few extreme months (a house down payment, a trip) would otherwise label most normal months
   * "below average". `median()` above returns the upper middle and is kept for recurring().

  function median_(sorted){
    if(!sorted.length) return 0;
    var n=sorted.length;
    return n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;

  function sortNum(a){ return a.slice().sort(function(x,y){ return x-y; }); }
  /** The daily baseline for month selKey: the owner's monthly budget when that is the chosen

   *  month; 'wait' while a window month is not loaded yet (#58). `mt` is monthTotals(). */
  function dailyBaseline(selKey,mt){
    if(BASELINE&&BASELINE.mode==='budget'&&BASELINE.amount>0) return { ref:BASELINE.amount, budget:true, months:0 };
    var keys=baselineWindow(selKey); if(!keys.length) return null;
    if(!keys.every(keyCovered)) return 'wait';

  }
  /** Per daily category, its median over the same window: { byCat: { cat: { ref, any } }, months }.
   *  `any` says the category had spend in some window month; a category missing from byCat had none. */
  function catMedians(selKey,mt){
    var keys=baselineWindow(selKey); if(!keys.length) return null;
    if(!keys.every(keyCovered)) return 'wait';
    var cats={};
    keys.forEach(function(k){ if(mt[k]) Object.keys(mt[k].cats).forEach(function(c){ cats[c]=1; }); });
    var byCat={};
    Object.keys(cats).forEach(function(c){
      var vals=keys.map(function(k){ return (mt[k]&&mt[k].cats[c])||0; });
      byCat[c]={ ref:median_(sortNum(vals)), any:vals.some(function(v){ return v>0; }) };
    });
    return { byCat:byCat, months:keys.length };
  }
  /** Detected subscriptions (recurring()) whose recent rows are all in daily categories. A project's
   *  recurring charge (a car loan, say) never feeds the daily estimate. */
  function dailySubs(){
    var recent={}; monthsBack(6).forEach(function(o){ recent[ymKey(o.y,o.m)]=1; });
    var projMerchants={};
    TXNS.forEach(function(t){ if(isConsumption(t)&&isProjectCat(t.cat)&&recent[ymKey(t.y,t.m)]) projMerchants[t.merchant]=1; });
    return recurring().filter(function(s){ return !projMerchants[s.name]; });
  }
  /** Month-end estimate of daily spending for the current month r: daily so far without the
   *  daily-category subscriptions, per elapsed day, times the days in the month, plus those
   *  subscriptions' monthly total, less this month's refunds. The month's own total once it ends. */
  function dailyEstimate(r,dly){
    var dim=daysInMonth(r.year,r.month), el=Math.min(NOW.day,dim);
    if(el>=dim) return dly.total;
    var subs=dailySubs(), names={}, subTot=0;
    subs.forEach(function(s){ names[s.name]=1; subTot+=s.amt; });
    var base=sum(dly.list.filter(function(t){ return !names[t.merchant]; }));
    return Math.round(base/el*dim+subTot-dly.refunds);
  }
  /** Average daily total of the 3 months ending with the selected month (the previous month while
   *  it is still running) and its change against the 3 months before. null when those months reach
   *  before BASE_FLOOR; 'wait' while one is not loaded. `delta` is null when the previous three do. */
  function threeMonth(selKey,partial,mt){
    var end=partial?addMonths(selKey,-1):selKey;
    var last=[addMonths(end,-2),addMonths(end,-1),end], prev=[addMonths(end,-5),addMonths(end,-4),addMonths(end,-3)];
    if(last[0]<BASE_FLOOR) return null;
    var withPrev=prev[0]>=BASE_FLOOR;
    if(!last.concat(withPrev?prev:[]).every(keyCovered)) return 'wait';
    function avg(keys){ return keys.reduce(function(s,k){ return s+(mt[k]?mt[k].daily:0); },0)/keys.length; }
    var a=avg(last), b=withPrev?avg(prev):null;

  }
  /** Year / 全部期間: the complete months in scope, from the first month with data, never the
   *  running one. Their daily average is what those scopes show instead of a baseline. */
  function completeMonthsIn(r,mt){
    var keys=Object.keys(mt).sort(); if(!keys.length) return [];
    var cp=curPartialKey(), lastDone=cp?addMonths(cp,-1):ymKey(NOW.year,NOW.month);

    if(r.level==='year'){ if(ymKey(r.year,1)>start) start=ymKey(r.year,1); if(ymKey(r.year,12)<end) end=ymKey(r.year,12); }
    var out=[]; for(var k=start;k<=end;k=addMonths(k,1)) out.push(k);
    return out;
  }

  function txnRow(t,showCat){ return '<div class="txn"><span class="badge">'+t.bank+'</span><span class="m">'+esc(t.merchant)+(showCat?' <span class="cat">'+esc(t.cat)+'</span>':'')+'</span><span class="d num">'+t.y+'/'+('0'+t.m).slice(-2)+'/'+('0'+t.d).slice(-2)+'</span><span class="a num">$'+fmt(t.amount)+splitMark(t)+'</span></div>'; }
  function incomeList(list,incTotal){ if(!list.length) return '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">此範圍沒有收入</div>'; var imap={}; list.forEach(function(t){ imap[t.cat]=(imap[t.cat]||0)+t.amount; }); var items=Object.keys(imap).map(function(k){return {name:k,total:imap[k]};}).sort(function(a,b){return b.total-a.total;}); var out=''; items.forEach(function(it){ var pct=incTotal>0?it.total/incTotal*100:0; out+='<div style="padding:6px 0;border-bottom:1px solid var(--border)"><div class="lrow" style="padding:0;border:none"><span class="ln">'+esc(it.name)+'</span><span class="la inc num">$'+fmt(it.total)+'</span></div><div class="sharebar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>'; }); out+='<div class="ltot"><span class="t-l">收入合計</span><span class="t-v num" style="color:var(--income)">$'+fmt(incTotal)+'</span></div>'; return out; }
  function monthsBack(n){ var arr=[],y=NOW.year,mm=NOW.month; for(var i=0;i<n;i++){ arr.unshift({y:y,m:mm}); mm--; if(mm<1){mm=12;y--;} } return arr; }
  function recurring(){ var m={}; TXNS.filter(isConsumption).forEach(function(t){ var k=t.y+'-'+('0'+t.m).slice(-2); if(!m[t.merchant])m[t.merchant]={}; m[t.merchant][k]=(m[t.merchant][k]||0)+t.amount; }); var recent=monthsBack(6).map(function(o){return o.y+'-'+('0'+o.m).slice(-2);}); var last2=recent.slice(-2); var out=[]; Object.keys(m).forEach(function(name){ var present=recent.filter(function(k){return m[name][k]!=null;}); if(present.length<4) return; if(!last2.some(function(k){return m[name][k]!=null;})) return; var amts=present.map(function(k){return m[name][k];}); var med=median(amts); if(amts.every(function(a){return Math.abs(a-med)<=med*0.12;})) out.push({name:name,amt:med}); }); return out.sort(function(a,b){return b.amt-a.amt;}); }
  function subPanel(subs,tot){ if(!subs.length) return '<div style="color:var(--text-muted);font-size:12px">未偵測到定期扣款</div>'; var out=''; subs.forEach(function(x){ out+='<div class="lrow"><span class="ln">'+esc(x.name)+'</span><span class="ls">每月</span><span class="la num">$'+fmt(x.amt)+'</span></div>'; }); out+='<div class="ltot"><span class="t-l">每月合計</span><span class="t-v num">$'+fmt(tot)+'</span></div>'; return out; }
  function topMerchants(exp){ var m={}; exp.forEach(function(t){ if(!m[t.merchant])m[t.merchant]={total:0,count:0}; m[t.merchant].total+=t.amount; m[t.merchant].count++; }); var arr=Object.keys(m).map(function(k){return {name:k,total:m[k].total,count:m[k].count};}).sort(function(a,b){return b.total-a.total;}).slice(0,6); if(!arr.length) return '<div style="color:var(--text-muted);font-size:12px">無資料</div>'; var out=''; arr.forEach(function(x){ out+='<div class="lrow"><span class="ln">'+esc(x.name)+'</span><span class="ls num">'+x.count+' 筆</span><span class="la num">$'+fmt(x.total)+'</span></div>'; }); return out; }

  // ---------- 總覽 ----------
  // Daily spending is the headline, compared with a normal month (the median of the window, or the
  // owner's budget). Project categories sit in their own card with this period's amount and a
  // running total since their start month. Baselines and per-category deltas only mean something
  // for a single month; a year or 全部期間 shows the daily total and its average per complete month.
  function periodTab(){
    var r=resolveScope(state.scope);
    if(scopeNeedsHistory(r)) return historyPanel(r);
    var mt=monthTotals(), dly=dailyOf(r);
    var selKey=(r.level==='month')?ymKey(r.year,r.month):null;
    var left=heroCard(r,selKey,mt,dly)+dailyCard(r,selKey,mt,dly);
    var heat=heatPanel(r,isConsumption);
    var right=projectsCard(r,dly)
      +'<div class="panel"><h3>消費日曆 <span class="h3note">'+(heat?r.year+' / '+r.month+' · 含專案 · 點日子看明細':'')+'</span></h3>'
      +(heat||'<div class="empty" style="padding:var(--sp4) 0">消費日曆只在「月」顯示。</div>')+'</div>';
    return '<div class="ovgrid"><div class="ovcol">'+left+'</div><div class="ovcol">'+right+'</div></div>';
  }
  /** The status chip: within ±5% of normal, then warn up to +20% and bad above, good below. */
  function heroChip(value,base,estimate){
    if(base==='wait') return '<span class="chip flat">'+historyWaitText()+'</span>';
    if(!base||!(base.ref>0)) return '';
    var d=Math.round((value-base.ref)/base.ref*100), pre=estimate?'預估 ':'';
    if(Math.abs(d)<=5) return '<span class="chip ok">'+pre+'接近常態</span>';
    if(d>0) return '<span class="chip '+(d>20?'bad':'warn')+'">'+pre+'高於常態 '+d+'%</span>';
    return '<span class="chip good">'+pre+'低於常態 '+Math.abs(d)+'%</span>';
  }
  function heroCard(r,selKey,mt,dly){
    var partial=isPartialCur(r), cur=isCurMonth(r);
    var base=selKey?dailyBaseline(selKey,mt):null;
    var est=(selKey&&cur)?dailyEstimate(r,dly):null;
    var h='<div class="panel hero"><div class="hero-top"><span class="eyebrow">日常支出</span>'
      +(selKey?heroChip(est!=null&&partial?est:dly.total,base,est!=null&&partial):'')+'</div>'
      +'<div class="hero-num num">$'+fmt(dly.total)+'</div>';
    if(selKey){
      var ref=(base&&base!=='wait')?base.ref:0, ratio=ref>0?dly.total/ref:0;
      var fill=Math.min(ratio,1)/1.4*100, over=Math.max(0,Math.min(ratio,1.4)-1)/1.4*100;
      h+='<div class="hmeter" aria-hidden="true"><i class="hm-fill" style="width:'+fill.toFixed(1)+'%"></i>'
        +(over>0?'<i class="hm-over" style="left:'+(100/1.4).toFixed(1)+'%;width:'+over.toFixed(1)+'%"></i>':'')
        +'<i class="hm-mark"></i></div>';
      var leftTxt=base==='wait'?historyWaitText()
        :(!base?'尚無常態可比':(base.budget?'自訂預算 $'+fmt(base.ref):'常態（'+base.months+' 個月中位數）$'+fmt(base.ref)));
      var rightTxt=(est!=null&&partial)?'預估月底 $'+fmt(est):(ref>0?Math.round(ratio*100)+'%':'');
      h+='<div class="hero-legend num"><span>'+leftTxt+'</span><span>'+rightTxt+'</span></div>';
    } else {
      var months=completeMonthsIn(r,mt), tot=months.reduce(function(s,k){ return s+(mt[k]?mt[k].daily:0); },0);
      h+='<div class="hero-legend num"><span>'+(months.length?'平均每月 $'+fmt(tot/months.length)+'（'+months.length+' 個完整月）':'尚無完整月份')+'</span></div>';
    }
    var adv=advIn(dly.list), notes=[];
    if(dly.refunds>0) notes.push('已折抵退款 −$'+fmt(dly.refunds));
    if(adv>0) notes.push('<span class="adv">刷卡 $'+fmt(dly.gross+adv)+' · 代墊 $'+fmt(adv)+' 不計入</span>');
    if(selKey){
      var tm=threeMonth(selKey,partial,mt);
      if(tm==='wait') notes.push('近 3 月平均 '+historyWaitText());
      else if(tm) notes.push('近 3 月平均 $'+fmt(tm.avg)+(tm.delta==null?'':(tm.delta===0?' 持平':' <span class="delta '+(tm.delta>0?'up':'down')+'">'+(tm.delta>0?'▲':'▼')+Math.abs(tm.delta)+'%</span>')));
    }
    if(notes.length) h+='<div class="hero-sub num">'+notes.join(' · ')+'</div>';
    // Income, balance and savings rate against ALL outflow (daily + projects), as before the split.
    var incList=TXNS.filter(function(t){ return isIncome(t)&&inScope(t,r); }), inc=sum(incList);
    var outflow=sumScope(isConsumption,r)-dly.refunds, net=inc-outflow;
    var count=TXNS.filter(function(t){ return (isConsumption(t)||isIncome(t))&&inScope(t,r); }).length;
    h+='<div class="hero-stats num">'
      +'<div><span>收入</span><b class="inc">'+(inc>0?'$'+fmt(inc):'—')+'</b></div>'
      +'<div><span>結餘</span><b class="'+(net>=0?'inc':'spend')+'">'+(inc>0?(net>=0?'+':'−')+'$'+fmt(Math.abs(net)):'—')+'</b></div>'
      +'<div><span>儲蓄率</span><b>'+(inc>0?Math.round(net/inc*100)+'%':'—')+'</b></div>'
      +'<div><span>筆數</span><b>'+fmt(count)+'</b></div></div>';
    if(incList.length){
      h+='<button type="button" class="incsrc-toggle" data-incsrc aria-expanded="'+(incomeOpen?'true':'false')+'"><span>收入來源</span><span class="chev">▶</span></button>'
        +(incomeOpen?'<div class="incsrc">'+incomeList(incList,inc)+'</div>':'');

  /** Daily categories as horizontal bars, largest first, each with a white marker at its normal
   *  month and a vs-normal chip; tapping one lists its rows, tapping a row opens editRow. Deltas
   *  only for a completed single month. */
  function dailyCard(r,selKey,mt,dly){
    var map={}; dly.list.forEach(function(t){ if(!map[t.cat]) map[t.cat]={total:0,count:0}; map[t.cat].total+=t.amount; map[t.cat].count++; });
    var items=Object.keys(map).map(function(k){ return {name:k,total:map[k].total,count:map[k].count}; }).sort(function(a,b){ return b.total-a.total; });
    var norms=(selKey&&!isPartialCur(r))?catMedians(selKey,mt):null;
    var scale=items.length?items[0].total:0;
    if(norms&&norms!=='wait') items.forEach(function(it){ var b=norms.byCat[it.name]; if(b&&b.ref>scale) scale=b.ref; });
    var h='<div class="panel"><h3>日常類別 <span class="h3note">'+(norms&&norms!=='wait'?'白線 = 常態月':'')+'</span></h3>';
    if(!items.length) return h+'<div class="empty" style="padding:var(--sp4) 0">此範圍沒有日常支出</div></div>';
    items.forEach(function(it){ h+=rowCard(it,scale,dly.list,norms); });
    return h+'</div>';
  }
  /** vs-normal chip for one daily category. `norms` null ⇒ nothing (year / 全部 / a running month);
   *  'wait' ⇒ the loading mark. No spend in any window month ⇒ 新; spend but a median of 0 (it shows
   *  up in fewer than half the months) ⇒ no chip, since a percentage of 0 means nothing. */
  function catDelta(name,cur,norms){

  /**

        if(current&&current[field]===applied) revertTxn(current.id, undo); else repaint();
        if(ROW_DELETE_INTENTS[rowKey]) cancelDeleteIntent(rowKey);
        toast('寫入失敗:'+((err&&err.message)||err), true); done();
      })
      .updateTxn(serverId, patch, 'recent', OLDER_FP);
    },function(){ settle(seq,null); });
  }

  function normalizedTextValue(value){ return String(value==null?'':value).trim(); }

  /** Issue exactly one field write. A newer blur is retained as one coalesced pending revision. */
  function issueTextSave(id,field,revision,rawValue,isCancel){
    var t=textTxn(id); if(!t) return;
    var rowKey=ensureTextRowKey(t);
    var q=textWriteQueue(id,field), value=normalizedTextValue(rawValue);
    var token=nextTextRequestToken(id,field), prev=t[field];
    q.active={token:token,revision:revision,rawValue:rawValue,value:value,prev:prev,cancel:!!isCancel};
    t[field]=value;
    var patch={}; patch[field]=value;
    var seq=nextMutation();
    enqueueRowWrite(rowKey,function(done){
    google.script.run
      .withSuccessHandler(function(res){
        var active=q.active, current=textDraft(rowKey,field), rowIntent=ROW_COMMIT_INTENTS[rowKey];
        if(active&&active.token===token) q.active=null;
        if(!rowIntent){
          if(current&&current.revision===revision){
            delete TEXT_DRAFTS[draftKey(rowKey,field)]; syncTextCopies(rowKey,field,value,true,false);
          } else if(!q.pending) syncTextCopies(id,field,value,true,true);
        }
        if(settle(seq,ackTxns(TXNS,res),res&&res.olderFp)) repaint();
        drainTextWrite(rowKey,field);
        done();
      })
      .withFailureHandler(function(err){
        var active=q.active, current=textDraft(rowKey,field), rowIntent=ROW_COMMIT_INTENTS[rowKey];
        if(active&&active.token===token) q.active=null;
        settle(seq,null);
        if(ROW_DELETE_INTENTS[rowKey]) cancelDeleteIntent(rowKey);
        if(!rowIntent&&!q.pending){
          if((current&&current.revision===revision)||isCancel){
            var currentTxn=textTxn(rowKey), undo={}; undo[field]=prev;
            if(currentTxn) revertTxn(currentTxn.id,undo); else repaint();
          }
          toast('寫入失敗:'+((err&&err.message)||err),true);
        }
        drainTextWrite(rowKey,field);
        done();
      })
      .updateTxn(resolveTextRowId(rowKey),patch,'recent',OLDER_FP);
    });
  }

  function drainTextWrite(id,field){
    id=textRowKey(id);
    var q=textWriteQueue(id,field); if(q.active) return;
    if(ROW_COMMIT_INTENTS[id]){ trySendRowCommit(id); return; }
    var pending=q.pending;
    // A delete intent blocks new edits, but revisions already queued before confirmation must
    // still reach the sheet first so Deleted preserves the last value the owner entered.
    if(ROW_DELETE_INTENTS[id]&&!pending) return;
    q.pending=null;
    if(!pending) return;
    if(pending.cancel){ issueTextSave(id,field,pending.revision,pending.value,true); return; }
    var current=textDraft(id,field);
    if(current&&current.revision>=pending.revision) issueTextSave(id,field,current.revision,current.value);
  }

  /** Save one free-text draft, serialising all requests for this logical field. */
  function saveTextDraft(id,field){
    id=textRowKey(id);
    var d=textDraft(id,field); if(!d||!d.dirty) return;
    var q=textWriteQueue(id,field);
    if(ROW_DELETE_INTENTS[id]) return;
    var t=textTxn(id);
    if(t&&t._pendingAdd){ q.pending={revision:d.revision,value:d.value}; return; }
    var intent=ROW_COMMIT_INTENTS[id];
    if(intent){
      var included=null;
      for(var i=0;i<intent.saved.length;i++) if(intent.saved[i].field===field){ included=intent.saved[i]; break; }
      if(!included||d.revision>included.revision) q.pending={revision:d.revision,value:d.value};
      return;
    }
    if(q.active){ q.pending={revision:d.revision,value:d.value}; return; }
    issueTextSave(id,field,d.revision,d.value);
  }

  /** Send a queued Record only after older per-field writes have completed on the server. */
  function trySendRowCommit(id){
    id=textRowKey(id);
    var intent=ROW_COMMIT_INTENTS[id]; if(!intent||intent.sent||intent.queued) return;
    var t=textTxn(id); if(t&&t._pendingAdd) return;
    for(var i=0;i<intent.saved.length;i++){
      if(textWriteQueue(id,intent.saved[i].field).active) return;
    }
    intent.queued=true;
    intent.saved.forEach(function(s){
      var q=textWriteQueue(id,s.field);
      s.token=nextTextRequestToken(id,s.field);
      q.active={token:s.token,revision:s.revision,rawValue:s.rawValue,value:s.value,record:true};
    });
    var seq=nextMutation();
    enqueueRowWrite(id,function(done){
    intent.sent=true;
    google.script.run
      .withSuccessHandler(function(res){
        intent.saved.forEach(function(s){
          var q=textWriteQueue(id,s.field), current=textDraft(id,s.field);
          if(q.active&&q.active.token===s.token) q.active=null;
          if(current&&current.revision===s.revision){
            delete TEXT_DRAFTS[draftKey(id,s.field)]; syncTextCopies(id,s.field,s.value,true,false);
          }
        });
        delete ROW_COMMIT_INTENTS[id];
        if(settle(seq,ackTxns(TXNS,res),res&&res.olderFp)) repaint();
        ['merchant'].forEach(function(field){ drainTextWrite(id,field); });
        done();
      })
      .withFailureHandler(function(err){
        intent.saved.forEach(function(s){
          var q=textWriteQueue(id,s.field); if(q.active&&q.active.token===s.token) q.active=null;
        });
        delete ROW_COMMIT_INTENTS[id];
        settle(seq,null);
        if(ROW_DELETE_INTENTS[id]) cancelDeleteIntent(id);
        var currentTxn=textTxn(id); if(currentTxn) revertTxn(currentTxn.id,intent.undo); else repaint();
        toast('寫入失敗:'+((err&&err.message)||err),true);
        ['merchant'].forEach(function(field){ drainTextWrite(id,field); });
        done();
      })
      .updateTxn(resolveTextRowId(id),intent.patch,'recent',OLDER_FP);
    });
  }

  /** Record a row and any dirty text as one authoritative patch. */
  function commitRow(id,posted){
    var t=textTxn(id); if(!t) return;
    id=ensureTextRowKey(t); if(ROW_COMMIT_INTENTS[id]||ROW_DELETE_INTENTS[id]) return;
    var intent={patch:{posted:posted},undo:{posted:t.posted},saved:[],sent:false};
    ['merchant'].forEach(function(field){
      var d=textDraft(id,field); if(!d||!d.dirty) return;
      var value=normalizedTextValue(d.value), q=textWriteQueue(id,field);
      q.pending=null;
      intent.patch[field]=value; intent.undo[field]=t[field]; t[field]=value;
      intent.saved.push({field:field,revision:d.revision,rawValue:d.value,value:value});
    });
    ROW_COMMIT_INTENTS[id]=intent; t.posted=posted; render();
    toast(posted?'已記帳 · 從清單移除':'已取回待記帳');
    trySendRowCommit(id);
  }

  function isRowDeleting(t){

  /**
   * Confirming answers at once: the modal closes and the row repaints in its deleting state
